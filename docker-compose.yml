# 로컬 개발·통합 확인용 실행 환경 (constitution "실행": app + PostgreSQL + Redis + MinIO, 개발용 Mailpit).
# 비밀값은 .env(커밋하지 않음)로만 주입한다. .env.example을 복사해 쓴다: cp .env.example .env
# 이미지 태그는 backend 통합 테스트(Testcontainers)와 같게 둔다: postgres:18-alpine, redis:7-alpine.
name: blog

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # 02 §2: AOF everysec, noeviction (세션·자동 저장 버퍼를 지우지 않음)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 공식 MinIO 이미지 배포 중단으로 커뮤니티 포크를 쓴다 (04 §6-1)
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    # 관리 콘솔은 밖으로 열지 않는다(003 FR-026, 23 §2-2): 9001 포트 매핑 없음
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?STORAGE_ROOT_USER를 .env에 넣어 주세요}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?STORAGE_ROOT_PASSWORD를 .env에 넣어 주세요}
      # 우리 출처만 CORS 허용 (app 8080, Vite 개발 서버 5173) — 점검 10·11 (contracts/storage.md §1)
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # 일회성: 버킷 blog, images/* 익명 GetObject, 앱 전용 사용자(Put·Get·DeleteObject) — 003 T004, scripts/minio-init.sh
    # 실행: docker compose run --rm minio-init  (app도 이 서비스가 끝난 뒤 뜬다)
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    environment:
      S3_ENDPOINT: http://minio:9000
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER:?STORAGE_ROOT_USER를 .env에 넣어 주세요}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?STORAGE_ROOT_PASSWORD를 .env에 넣어 주세요}
      BLOG_IMAGE_STORAGE_ACCESS_KEY: ${BLOG_IMAGE_STORAGE_ACCESS_KEY:-blog-app-local}
      BLOG_IMAGE_STORAGE_SECRET_KEY: ${BLOG_IMAGE_STORAGE_SECRET_KEY:-blog-app-local-secret}
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailpit:
    # 개발용 메일 확인 (SMTP 1025, 웹 8025) — 02 §2
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    # 013 자체 AI (태그 추천 대체 공급자, research R12). 고정 태그(2026-10-08 기준 2주 넘게 지난 마지막 패치판) — 올릴 때 OllamaSmokeIT(-Dollama.smoke=true)로 다시 잰다.
    # 호스트 포트를 열지 않는다(app만 compose 안에서 http://ollama:11434로 부른다). 개발 중 직접 부르려면 아래 주석을 푼다:
    # ports:
    #   - "11434:11434"
    # 메모리: qwen2.5:1.5b 기준 약 2GB(모델) + 여유. 배포 서버에서는 2~4GB 한도를 둔다(T005 가정):
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g
    image: ollama/ollama:0.34.4
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    # 일회성: 모델 내려받기 (볼륨에 있으면 바로 끝난다). app은 이 서비스가 끝난 뒤 뜬다
    image: ollama/ollama:0.34.4
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      REDIS_HOST: redis
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # 서버 → 저장소는 compose 안 주소, 브라우저 → 저장소(서명 주소)는 localhost:9000 (003 research R20)
      BLOG_IMAGE_STORAGE_ENDPOINT: http://minio:9000
      # 로컬 전용 기본값(.env에 없을 때). minio-init과 같은 값이어야 한다
      BLOG_IMAGE_STORAGE_ACCESS_KEY: ${BLOG_IMAGE_STORAGE_ACCESS_KEY:-blog-app-local}
      BLOG_IMAGE_STORAGE_SECRET_KEY: ${BLOG_IMAGE_STORAGE_SECRET_KEY:-blog-app-local-secret}
      # 013 AI 태그 추천: Gemini 키(무료 등급)가 비어 있거나 한도가 다 되면 compose 안 Ollama로 추천한다
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      BLOG_AI_TAG_SUGGEST_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
