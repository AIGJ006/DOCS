# 운영(팀 공용 서버) 실행 환경. 서버의 ~/buildlog/ 에서 deploy.sh가 실행한다 (deploy/README.md).
#   - 이미지 buildlog-app:<커밋 sha>|latest 는 GitHub Actions가 만들어 docker load 한 것 (여기서 build 하지 않는다)
#   - 값은 전부 같은 폴더의 .env(GitHub Secrets로 만든 파일, 권한 600)에서 온다 — 이 파일에 실제 값을 쓰지 않는다
#   - 기본으로 뜨는 것: edge(nginx) · app · redis · minio · minio-init(일회성)
#   - profile "ai": ollama(+모델 내려받기)  /  profile "localdb": Crowfoot DB 대신 쓸 postgres
#     켜는 법: .env에 COMPOSE_PROFILES=ai 또는 COMPOSE_PROFILES=localdb (둘 다면 ai,localdb)
# 로컬 개발용은 저장소 루트 docker-compose.yml (이 파일과 따로 간다).
name: buildlog

services:
  edge:
    # 서버 nginx(TLS) → 이 컨테이너(80) → /blog/ 는 minio:9000, 나머지는 app:8080 (deploy/nginx.conf.template)
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      # 호스트에 여는 포트는 이것 하나. 127.0.0.1에만 묶는다: 서버 nginx가 같은 호스트에서 localhost:<APP_PORT>로 붙으므로
      # 바깥에서 직접 들어올 필요가 없고, 0.0.0.0으로 열면 TLS·서버 nginx를 거치지 않는 평문 길이 인터넷에 생긴다
      # (도커가 iptables를 직접 고쳐 서버 방화벽(ufw 등)도 우회한다).
      - "127.0.0.1:${APP_PORT:?APP_PORT를 .env에 넣어 주세요}:80"
    environment:
      # 템플릿(envsubst)에 들어가는 값. deploy.sh가 SITE_URL에서 뽑아 넘긴다
      SITE_HOST: ${SITE_HOST:?deploy.sh로 실행해 주세요 (SITE_HOST)}
      SITE_SCHEME: ${SITE_SCHEME:-https}
      NGINX_ENVSUBST_FILTER: ^SITE_
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app
      - minio

  app:
    image: buildlog-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    # 공용 서버: 메모리 상한(필요하면 .env에서 APP_MEM_LIMIT로 바꾼다). 힙은 그 75%
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SITE_URL: ${SITE_URL:?SITE_URL을 .env에 넣어 주세요}
      # DB (Crowfoot 발급, 또는 profile localdb면 DB_ADDRESS=postgres)
      DB_ADDRESS: ${DB_ADDRESS:?DB_ADDRESS를 .env에 넣어 주세요}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME을 .env에 넣어 주세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 넣어 주세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_HOST: redis
      # 메일 (외부 SMTP). 비어 있으면 메일만 안 나간다
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      BLOG_MAIL_FROM: ${BLOG_MAIL_FROM:-${SPRING_MAIL_USERNAME:-no-reply@localhost}}
      # 소셜 로그인 (비어 있는 제공자는 버튼이 숨는다)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # 사진 저장소: 서버 → minio는 compose 안 주소. 브라우저용 주소는 prod 프로필이 SITE_URL로 만든다
      BLOG_IMAGE_STORAGE_ENDPOINT: http://minio:9000
      BLOG_IMAGE_STORAGE_ACCESS_KEY: ${BLOG_IMAGE_STORAGE_ACCESS_KEY:?BLOG_IMAGE_STORAGE_ACCESS_KEY를 .env에 넣어 주세요}
      BLOG_IMAGE_STORAGE_SECRET_KEY: ${BLOG_IMAGE_STORAGE_SECRET_KEY:?BLOG_IMAGE_STORAGE_SECRET_KEY를 .env에 넣어 주세요}
      # AI 태그 추천: Gemini 키가 있으면 Gemini. 자체 AI(ollama)는 profile ai + OLLAMA_ENABLED=true일 때만
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Gemini 키도 자체 AI도 없으면 추천은 늘 실패로 답한다 — 그때는 false로 꺼 두면 "기능 꺼짐(DISABLED)"으로 답한다
      BLOG_AI_TAG_SUGGEST_ENABLED: ${BLOG_AI_TAG_SUGGEST_ENABLED:-true}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      BLOG_AI_TAG_SUGGEST_OLLAMA_BASE_URL: http://ollama:11434
    # 호스트 포트 없음 — edge만 붙는다
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 로컬 compose와 같은 옵션 (02 §2: AOF everysec, noeviction)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 로컬 compose와 같은 커뮤니티 포크·태그 (04 §6-1). 관리 콘솔 포트는 열지 않는다
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?STORAGE_ROOT_USER를 .env에 넣어 주세요}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?STORAGE_ROOT_PASSWORD를 .env에 넣어 주세요}
      # 우리 사이트 출처만 CORS 허용 (업로드는 같은 도메인 /blog/ 로 가지만 명시해 둔다)
      MINIO_API_CORS_ALLOW_ORIGIN: ${SITE_URL:?SITE_URL을 .env에 넣어 주세요}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # 일회성: 버킷 blog, images/* 익명 읽기, 앱 전용 사용자 (scripts/minio-init.sh 그대로 — 워크플로가 같은 폴더로 복사한다).
    # 여러 번 실행해도 결과가 같고 데이터(볼륨)는 건드리지 않는다
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    environment:
      S3_ENDPOINT: http://minio:9000
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER:?STORAGE_ROOT_USER를 .env에 넣어 주세요}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?STORAGE_ROOT_PASSWORD를 .env에 넣어 주세요}
      BLOG_IMAGE_STORAGE_ACCESS_KEY: ${BLOG_IMAGE_STORAGE_ACCESS_KEY:?BLOG_IMAGE_STORAGE_ACCESS_KEY를 .env에 넣어 주세요}
      BLOG_IMAGE_STORAGE_SECRET_KEY: ${BLOG_IMAGE_STORAGE_SECRET_KEY:?BLOG_IMAGE_STORAGE_SECRET_KEY를 .env에 넣어 주세요}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  ollama:
    # profile ai (기본 꺼짐 — 공용 서버 메모리). 켜면 .env에 OLLAMA_ENABLED=true도 함께 넣는다
    profiles: ["ai"]
    image: ollama/ollama:0.34.4
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:0.34.4
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  postgres:
    # profile localdb: Crowfoot DB를 못 쓸 때만. .env에 DB_ADDRESS=postgres, DB_PORT=5432, DB_SCHEMA=public
    # (DB_NAME·DB_USERNAME·DB_PASSWORD는 이 컨테이너가 처음 뜰 때 그 값으로 만든다). 호스트 포트는 열지 않는다
    profiles: ["localdb"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME을 .env에 넣어 주세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 .env에 넣어 주세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

# 데이터 볼륨 이름을 고정한다 — 폴더·프로젝트 이름이 바뀌어도 같은 볼륨을 쓴다. 지우지 않는다(docker compose down -v 금지)
volumes:
  redis-data:
    name: buildlog-redis-data
  minio-data:
    name: buildlog-minio-data
  ollama-data:
    name: buildlog-ollama-data
  postgres-data:
    name: buildlog-postgres-data
