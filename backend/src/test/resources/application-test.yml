# 통합 테스트 프로필. DB·Redis 접속 정보는 Testcontainers @ServiceConnection이 넣는다(support/IntegrationTestBase).
# 메일은 끄지 않고 support/CapturingMailSender(@Primary JavaMailSender)가 받는다.
logging:
  level:
    root: WARN
    com.team.blog: INFO
    org.flywaydb: WARN
    org.springframework.security: WARN
# 002: 1분 반영 배치(AutosaveFlushJob)가 시험 중에 스스로 돌아 Redis·DB 단언을 흔들지 않게 주기를 길게 둔다.
# 배치 시험은 메서드를 직접 부른다(AutosaveFlushJobIT).
blog:
  autosave:
    flush-interval: 1h
  # 002 다시 렌더링 배치(RerenderJob)도 시험 중에 스스로 돌지 않게 한다(RerenderJobIT는 메서드를 직접 부른다).
  markdown:
    rerender-interval: 24h
  # 009 조회 반영 배치(ViewFlushJob)도 시험 중에 스스로 돌지 않게 한다(ViewFlushJobIT는 메서드를 직접 부른다).
  view:
    flush-interval: 24h
  # 002 T119: 트랜잭션 안의 Redis 쓰기(RedisGuard.callWrite·runWrite)는 시험에서 예외로 막는다(운영 기본은 경고 로그).
  redis:
    fail-on-write-in-transaction: true
  # 001 US2: 소셜 로그인 흐름 시험용 가짜 앱 키(실제 비밀값 아님). 토큰 교환·사용자 정보는
  # account/integration/FakeSocialProvider가 대신한다.
  auth:
    social:
      google:
        client-id: test-google-client
        client-secret: test-google-secret
      github:
        client-id: test-github-client
        client-secret: test-github-secret
