# 통합 테스트 프로필. DB·Redis 접속 정보는 Testcontainers @ServiceConnection이 넣는다(support/IntegrationTestBase).
# 메일은 끄지 않고 support/CapturingMailSender(@Primary JavaMailSender)가 받는다.
logging:
  level:
    root: WARN
    com.team.blog: INFO
    org.flywaydb: WARN
    org.springframework.security: WARN
# 002: 1분 반영 배치(AutosaveFlushJob)가 시험 중에 스스로 돌아 Redis·DB 단언을 흔들지 않게 주기를 길게 둔다.
# 배치 시험은 메서드를 직접 부른다(AutosaveFlushJobIT).
blog:
  autosave:
    flush-interval: 1h
