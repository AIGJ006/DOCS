# 004 US8 (선택 구현) 친구 공개. 이 프로필을 켠 환경만 FRIENDS를 허용한다(공통 기본 꺼짐, 2026-10-07 M1).
# - FriendsVisibilityRule·JdbcFriendshipChecker Bean 등록
# - Flyway가 db/friends/V900__friends.sql로 CHECK를 넓히고 ix_post_blog_friends를 만든다.
#   이후 공통 마이그레이션(V3…)은 V900보다 번호가 작으므로 out-of-order로 적용한다.
blog:
  visibility:
    friends:
      enabled: true
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/friends
    out-of-order: true
