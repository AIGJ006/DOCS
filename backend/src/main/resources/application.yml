# 공통 설정. 수치는 설정값으로 둔다 (constitution VII). 비밀값은 환경 변수로만 (constitution IV).
spring:
  application:
    name: blog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        # Jackson 3에서 WRITE_DATES_AS_TIMESTAMPS는 DateTimeFeature로 옮겨졌다 (Spring Boot 4)
        write-dates-as-timestamps: false
  data:
    redis:
      # 장애를 빨리 판정해 비로그인·통과 경로로 넘긴다 (02 §2-1)
      timeout: 500ms
      connect-timeout: 1s
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

server:
  shutdown: graceful
  # 클라이언트 IP·HTTPS 판별 (FR-037, R-13, H4): 신뢰 프록시(사설 대역 기본)에서 온 요청만 X-Forwarded-For의
  # 가장 오른쪽 신뢰 밖 주소를 getRemoteAddr()로 쓴다. 운영 LB 대역은 BLOG_TRUSTED_PROXIES(정규식 또는 CIDR 목록)로 준다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${BLOG_TRUSTED_PROXIES:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|127\.\d+\.\d+\.\d+}
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
    # 접근 로그(기본 꺼짐)를 켜면 쿼리 문자열은 가린 값(%{blog.maskedQuery}r)으로 남긴다 — 메일 링크 토큰 미기록 (FR-015)
    accesslog:
      pattern: '%h %l %u %t "%m %U%{blog.maskedQuery}r %H" %s %b %D'
  servlet:
    session:
      # 실제 세션 쿠키는 shared.security.session.SessionConfig가 만든다 (같은 값)
      timeout: ${blog.auth.session-timeout}
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

# ---------------------------------------------------------------------------
# 서비스 설정값 (blog.*) — constitution VII
# ---------------------------------------------------------------------------
blog:
  time-zone: Asia/Seoul
  image:
    # 공개 버킷 직접 주소. CSP(img-src·connect-src)와 이미지 주소·정화 허용 목록이 이 값 하나를 쓴다 (12 §8, H3)
    public-base-url: ${BLOG_IMAGE_PUBLIC_BASE_URL:http://localhost:9000/blog}
  scheduling:
    pool-size: 2
  async:
    event:
      core-size: 2
      max-size: 4
      queue-capacity: 500
    mail:
      core-size: 1
      max-size: 2
      queue-capacity: 500

  # 계정 메일 (FR-009, R-29). SMTP 접속은 spring.mail.*(개발 Mailpit, 운영은 배포 때 설정값)
  mail:
    from: ${BLOG_MAIL_FROM:no-reply@localhost}
    # 메일 링크 앞부분 (화면 주소의 스킴·호스트·포트)
    link-base-url: ${BLOG_MAIL_LINK_BASE_URL:http://localhost:8080}

  # 계정 (data-model §6)
  auth:
    session-timeout: 14d
    login:
      max-failures: 5
      lock-duration: 15m
      ip-limit-per-minute: 20
    verify:
      token-ttl: 24h
      resend-interval: 1m
      resend-daily-limit: 10
    reset:
      token-ttl: 30m
      email-interval: 1m
      email-daily-limit: 10
      ip-limit-per-hour: 20
    password-change:
      max-failures: 5
      lock-duration: 15m
    social:
      pending-ttl: 10m
      photo-hosts: lh3.googleusercontent.com,avatars.githubusercontent.com
  availability:
    ip-limit-per-minute: 30
  member:
    nickname-change-interval: 30d
    bio:
      max-length: 200
      max-lines: 4
    last-active:
      touch-interval: 1h
  agreement:
    terms:
      version: ${BLOG_AGREEMENT_TERMS_VERSION:2026-10-07}
      effective-date: ${BLOG_AGREEMENT_TERMS_EFFECTIVE_DATE:2026-10-07}
    privacy:
      version: ${BLOG_AGREEMENT_PRIVACY_VERSION:2026-10-07}
      effective-date: ${BLOG_AGREEMENT_PRIVACY_EFFECTIVE_DATE:2026-10-07}
  # 글 작성·자동 저장·발행 (002 plan Constraints, data-model §4)
  autosave:
    redis-ttl: 24h
    flush-interval: 1m
    rate-limit:
      limit: 1
      window: 5s
    max-request-bytes: 1048576
  post:
    max-tags: 10
    title-max: 100
    content-max: 100000
  publish:
    idempotency-ttl: 600s
  # 본문 렌더러 (12 §7-5~§7-7, 002 research A-10·B-7)
  markdown:
    render-timeout: 1s
    max-nesting: 20
    render-threads: 4
    preview-rate-limit:
      limit: 60
      window: 1m
    rerender-batch-size: 100
    rerender-interval: 10m
  # 빈 임시글 정리 (002 research B-4·B-9 제안)
  cleanup:
    empty-draft-cron: "0 30 3 * * *"
    zone: Asia/Seoul
    empty-draft-age: 24h
  policy:
    reserved-handles: classpath:policy/reserved-handles.txt
    reserved-nicknames: classpath:policy/reserved-nicknames.txt
    banned-words: classpath:policy/banned-words.txt
    banned-words-exceptions: classpath:policy/banned-words-exceptions.txt
    common-passwords: classpath:policy/common-passwords.txt

# ---------------------------------------------------------------------------
# Redis 회로 차단기 (002 research B-5): 연결 실패·시간 초과 비율 50%/최근 20회 → 30초 열림 → 반열림 5회 시험
# 실패로 세는 예외는 shared.infra.redis.RedisGuard가 직접 고른다(OOM은 세지 않음).
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: false
        register-health-indicator: false
