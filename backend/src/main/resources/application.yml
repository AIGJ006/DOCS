# 공통 설정. 수치는 설정값으로 둔다 (constitution VII). 비밀값은 환경 변수로만 (constitution IV).
spring:
  application:
    name: blog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        # Jackson 3에서 WRITE_DATES_AS_TIMESTAMPS는 DateTimeFeature로 옮겨졌다 (Spring Boot 4)
        write-dates-as-timestamps: false
  data:
    redis:
      # 장애를 빨리 판정해 비로그인·통과 경로로 넘긴다 (02 §2-1)
      timeout: 500ms
      connect-timeout: 1s
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

server:
  shutdown: graceful
  # 클라이언트 IP·HTTPS 판별 (FR-037, R-13, H4): 신뢰 프록시(사설 대역 기본)에서 온 요청만 X-Forwarded-For의
  # 가장 오른쪽 신뢰 밖 주소를 getRemoteAddr()로 쓴다. 운영 LB 대역은 BLOG_TRUSTED_PROXIES(정규식 또는 CIDR 목록)로 준다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${BLOG_TRUSTED_PROXIES:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|127\.\d+\.\d+\.\d+}
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
    # 접근 로그(기본 꺼짐)를 켜면 쿼리 문자열은 가린 값(%{blog.maskedQuery}r)으로 남긴다 — 메일 링크 토큰 미기록 (FR-015)
    accesslog:
      pattern: '%h %l %u %t "%m %U%{blog.maskedQuery}r %H" %s %b %D'
  servlet:
    session:
      # 실제 세션 쿠키는 shared.security.session.SessionConfig가 만든다 (같은 값)
      timeout: ${blog.auth.session-timeout}
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

# ---------------------------------------------------------------------------
# 서비스 설정값 (blog.*) — constitution VII
# ---------------------------------------------------------------------------
blog:
  time-zone: Asia/Seoul
  image:
    # 공개 버킷 직접 주소. CSP(img-src·connect-src)와 이미지 주소·정화 허용 목록이 이 값 하나를 쓴다 (12 §8, H3)
    public-base-url: ${BLOG_IMAGE_PUBLIC_BASE_URL:http://localhost:9000/blog}
    # ---- 003 사진 업로드 (data-model §5, media ImageProperties) ----
    upload-mode: DIRECT            # DIRECT | PROXY (research R2, 운영 점검 결과로 정함)
    quota-bytes: 1073741824        # 1인 1GB (FR-013)
    daily-limit: 200               # 하루 장수, 한국 시간 0시 기준 (FR-013)
    per-minute-limit: 20           # 1분 장수 (FR-011)
    presign-ttl: PT5M              # 업로드 주소 유효 시간 (FR-005)
    max-upload-bytes: 10485760     # 올라가는 원본 (V1 ck_image_size와 같아야 함)
    max-thumb-bytes: 1048576       # 썸네일 (V1 ck_image_thumb_size와 같아야 함)
    max-source-bytes: 52428800     # 브라우저가 처리할 원래 파일 상한 50MB (Q3, 화면만 사용)
    long-side: 1920                # 브라우저 줄이기 (FR-002)
    thumb-max-width: 640           # (FR-003)
    max-side: 4096                 # 서버 검사: GIF 아닌 원본 가로·세로 상한 (research R6)
    max-pixels: 16777216           # 서버 검사: 전체 픽셀 상한
    thumb-max-height: 4096         # 서버 검사: 썸네일 세로 상한
    gif-max-side: 1920             # (FR-036)
    gif-max-frames: 300            # (FR-036)
    profile-side: 256              # 프로필 사진 정확한 크기 (001)
    profile-max-bytes: 1048576
    inspect-head-bytes: 65536      # complete 앞부분 읽기 (research R6)
    cleanup:
      cron: "0 30 3 * * *"
      temp-ttl: PT24H
      detached-ttl: P7D
      batch-size: 1000
      max-duration: PT30M
    storage:
      endpoint: ${BLOG_IMAGE_STORAGE_ENDPOINT:http://localhost:9000}                    # 서버 → 저장소
      presign-endpoint: ${BLOG_IMAGE_STORAGE_PRESIGN_ENDPOINT:http://localhost:9000}    # 브라우저 → 저장소 (R20)
      region: ${BLOG_IMAGE_STORAGE_REGION:us-east-1}
      bucket: ${BLOG_IMAGE_STORAGE_BUCKET:blog}
      # 앱 전용 키 (PutObject·GetObject·DeleteObject만). 환경 변수로만 넣는다 — 비면 기동하지 않는다
      access-key: ${BLOG_IMAGE_STORAGE_ACCESS_KEY:}
      secret-key: ${BLOG_IMAGE_STORAGE_SECRET_KEY:}
  scheduling:
    pool-size: 2
  async:
    event:
      core-size: 2
      max-size: 4
      queue-capacity: 1000         # 011 research R5 (FR-003): 알림 리스너가 늘어 500 → 1,000
      await-termination: 20s       # 종료 때 남은 이벤트 처리를 기다리는 시간 (메일은 기본 10s)
    mail:
      core-size: 1
      max-size: 2
      queue-capacity: 500

  # 계정 메일 (FR-009, R-29). SMTP 접속은 spring.mail.*(개발 Mailpit, 운영은 배포 때 설정값)
  mail:
    from: ${BLOG_MAIL_FROM:no-reply@localhost}
    # 메일 링크 앞부분 (화면 주소의 스킴·호스트·포트)
    link-base-url: ${BLOG_MAIL_LINK_BASE_URL:http://localhost:8080}

  # 계정 (data-model §6)
  auth:
    session-timeout: 14d
    login:
      max-failures: 5
      lock-duration: 15m
      ip-limit-per-minute: 20
    verify:
      token-ttl: 24h
      resend-interval: 1m
      resend-daily-limit: 10
    reset:
      token-ttl: 30m
      email-interval: 1m
      email-daily-limit: 10
      ip-limit-per-hour: 20
    password-change:
      max-failures: 5
      lock-duration: 15m
    social:
      pending-ttl: 10m
      photo-hosts: lh3.googleusercontent.com,avatars.githubusercontent.com
      # 소셜 로그인 앱 키 (R-06, constitution IV — 값은 환경 변수로만, .env.example 참고). 비어 있으면 그 제공자는
      # 등록하지 않고 로그인 화면에서 버튼을 숨긴다. scope·주소는 코드(SocialClientRegistrationConfig)가 정한다:
      # Google openid,email,profile / GitHub read:user,user:email, redirect {baseUrl}/login/oauth2/code/{registrationId}
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
  availability:
    ip-limit-per-minute: 30
  member:
    nickname-change-interval: 30d
    bio:
      max-length: 200
      max-lines: 4
    last-active:
      touch-interval: 1h
  agreement:
    terms:
      version: ${BLOG_AGREEMENT_TERMS_VERSION:2026-10-07}
      effective-date: ${BLOG_AGREEMENT_TERMS_EFFECTIVE_DATE:2026-10-07}
    privacy:
      version: ${BLOG_AGREEMENT_PRIVACY_VERSION:2026-10-07}
      effective-date: ${BLOG_AGREEMENT_PRIVACY_EFFECTIVE_DATE:2026-10-07}
    # 013 AI 외부 전송 동의 문구 버전. 화면 features/ai-suggest/aiConsentText.ts의 상수와 같아야 한다 (research R10)
    ai:
      version: ${BLOG_AGREEMENT_AI_VERSION:2026-10-08}
      effective-date: ${BLOG_AGREEMENT_AI_EFFECTIVE_DATE:2026-10-08}
  # 글 작성·자동 저장·발행 (002 plan Constraints, data-model §4)
  autosave:
    redis-ttl: 24h
    flush-interval: 1m
    rate-limit:
      limit: 1
      window: 5s
    max-request-bytes: 1048576
  post:
    max-tags: 10
    title-max: 100
    content-max: 100000
    # 휴지통 (006 data-model §5, 13 D-1·§2-5). 보관 기간이 지난 휴지통 글은 매일 새벽 배치가 완전히 지운다
    trash:
      retention: P30D
      purge-cron: "0 30 3 * * *"
      purge-batch-size: 100
      purge-max-duration: PT30M
  # 내 글 관리 (006 data-model §5, 41 M-6). 클라이언트의 size는 무시하고 이 값으로 고정
  manage:
    page-size: 20
  publish:
    idempotency-ttl: 600s
  # 본문 렌더러 (12 §7-5~§7-7, 002 research A-10·B-7)
  markdown:
    render-timeout: 1s
    max-nesting: 20
    render-threads: 4
    preview-rate-limit:
      limit: 60
      window: 1m
    rerender-batch-size: 100
    rerender-interval: 10m
  # 빈 임시글 정리 (002 research B-4·B-9 제안)
  cleanup:
    empty-draft-cron: "0 30 3 * * *"
    zone: Asia/Seoul
    empty-draft-age: 24h
  # 태그 (008 data-model §5, research R16). 한 글의 태그 최대 수는 blog.post.max-tags
  tag:
    # 전체 태그 목록(/tags) 개수. 요청마다 계산한다(캐시 없음, 008 Clarifications Q1)
    top-limit: 100
    blog-strip:
      # 블로그 태그 줄 API 최대 개수 / 처음 보이는 개수
      limit: 100
      initial: 10
    suggest:
      limit: 10
      rate-limit:
        limit: 60
        window: 1m
  # 카테고리 (017 research R11). 회원당 최대 개수. 이름 30자는 DB 컬럼 길이라 설정값이 아님
  category:
    max-count: 100
  # 좋아요 (009 research R14). 좋아요·취소를 합쳐 회원당 제한, 매일 새벽 좋아요 수 보정
  like:
    rate-limit:
      limit: 60
      window: 1m
    reconcile-cron: "0 10 4 * * *"
  # 팔로우 (010 research R12). 팔로우·언팔로우 합산 요청 제한, 팔로워·팔로잉 목록 크기. 피드 카드 수는 blog.list.page-size
  follow:
    rate-limit:
      limit: 30
      window: 1m
    list-page-size: 20
  # 조회수 (009 research R14, FR-022). 중복 기준을 바꾸면 화면 안내 문구(005 VIEW_COUNT_NOTICE)도 함께 바꾼다
  view:
    dedupe-window: 24h
    max-per-window: 1
    rate-limit:
      limit: 60
      window: 1m
    flush-interval: 1m
    daily-retention: 90d
    retention-cron: "0 20 4 * * *"
    bot-user-agent-words: classpath:policy/view-bot-user-agents.txt
    visitor-cookie-max-age: 365d
  # 글 읽기 (005 data-model §6). 클라이언트의 size는 무시하고 이 값으로 고정 (10 L-2)
  list:
    page-size: 9
  seo:
    description-length: 160
    # 대표 사진이 없는 글·프로필 사진이 없는 블로그의 og:image (40 §5)
    default-og-image-url: ${BLOG_SEO_DEFAULT_OG_IMAGE_URL:http://localhost:8080/og-default.png}
  site:
    # canonical 절대 주소 앞부분 (끝 / 없이). 운영은 서비스 주소
    base-url: ${BLOG_SITE_BASE_URL:http://localhost:8080}
  # 트렌딩 (012 research R17). 점수 = (3×좋아요 + 2×남의 댓글 작성자 + 0.1×조회) / (경과 시간 + 2)^1.5.
  # 10분마다 상위 100개를 Redis에 30분 보관(ShedLock trendingSnapshot). 카드 수는 blog.list.page-size
  trending:
    window: 7d
    refresh-cron: "0 */10 * * * *"
    refresh-on-startup: true
    snapshot-size: 100
    snapshot-ttl: 30m
    per-author: 3
    weight-like: 3
    weight-commenter: 2
    weight-view: 0.1
    offset-hours: 2
    gravity: 1.5
    read-chunk: 18          # 건너뛰기용으로 한 번에 읽는 번호 수
  # 검색 (012 research R17). recent-window는 결과 순서와 무관한 성능 설정(33 §4)
  search:
    max-length: 50
    max-words: 5
    recent-window: 3000
    snippet-radius: 40
    people-limit: 20
    rate-limit:
      limit: 30
      window: 1m
  # 댓글 (007 research R15). 내용 최대는 DB varchar(1000)보다 클 수 없고 깊이는 공통 1
  comment:
    page-size: 20
    reply-preview: 3
    reply-page-size: 20
    content-max: 1000
    dedupe-window: 10s
    max-depth: 1
    around-max-replies: 100
    rate-limit:
      create:
        limit: 10
        window: 1m
      edit:
        limit: 20
        window: 1m
  # 알림 (011 research R17, data-model §6). 시간대는 공통 blog.time-zone
  notification:
    retention: 90d               # FR-037 — updated_at 기준
    max-per-member: 1000
    cleanup:
      cron: "0 30 4 * * *"      # ShedLock notificationCleanup
      batch-size: 1000
      recent-window: 1d          # 1,000개 정리 대상 고르기 (그날 받은 사람만)
    follow-dedup-window: 7d      # FR-014
    preview-length: 50           # FR-021 (코드 포인트)
    preview-scan: 400            # 목록 SQL이 댓글 앞부분만 읽는 길이
    dropdown-size: 10
    page-size: 20
  # 회원 탈퇴·복구 (015 data-model §9, research R16). 비밀번호 잠금 수치는 blog.auth.password-change.* 그대로
  withdraw:
    grace-period: 30d               # 복구 기한 = 정리 대상 경계 (FR-021a)
    suspended-purge-after: 365d     # 영구 정지 자동 정리 (Clarifications Q1)
    confirm-text: 탈퇴               # 소셜 가입 본인 확인 문구
    purge:
      # 03:30 사진·휴지통·임시 글 정리(003·006·002)보다 먼저 → 같은 날 사진 파일까지 지워진다 (SC-005).
      # 04:10·04:20 조회수(009)·04:30 알림(011)·04:45 신고(014)와도 겹치지 않는다. ShedLock 이름 withdrawPurge
      cron: "0 0 3 * * *"
      batch-size: 100
      # 이 단계 중 하나라도 Bean이 없으면 작업은 아무 회원도 처리하지 않고 ERROR만 남긴다 (research R9, T003 ①).
      # 65(010)·70(011)·80(014)은 그 기능이 머지될 때까지 015의 임시 구현(Interim*WithdrawalPurgeStep)이 채운다.
      # 임시 구현은 @ConditionalOnMissingClass로 진짜 단계 클래스가 생기면 스스로 빠진다 (T003·T064)
      required-orders: [10, 20, 30, 40, 50, 60, 65, 70, 80, 90]
      # 정리 커밋 뒤 지울 Redis 키 ({memberId}, {emailHash} = 로그인 이메일 SHA-256). 회원 번호 키를 새로 만드는
      # 기능은 여기에 한 줄을 더한다 (contracts/purge-steps.md §6)
      redis-key-templates:
        - "auth:pw-change-fail:{memberId}"
        - "auth:login-fail:{emailHash}"
        - "rl:verify-resend:{memberId}"
        - "ratelimit:autosave:{memberId}"
        - "ratelimit:preview:{memberId}"
        - "ratelimit:like:{memberId}"
        - "ratelimit:comment:{memberId}"
        - "ratelimit:comment-edit:{memberId}"
        - "ratelimit:image:{memberId}"
        - "ratelimit:tag-suggest:{memberId}"
        - "ratelimit:follow:{memberId}"
        - "rl:reset:email:{emailHash}"
        - "member:active-touch:{memberId}"
  policy:
    reserved-handles: classpath:policy/reserved-handles.txt
    reserved-nicknames: classpath:policy/reserved-nicknames.txt
    banned-words: classpath:policy/banned-words.txt
    banned-words-exceptions: classpath:policy/banned-words-exceptions.txt
    common-passwords: classpath:policy/common-passwords.txt
  # 신고·숨김·정지 (014 research R14, data-model §7). 시간대는 공통 blog.time-zone
  moderation:
    snapshot-content-chars: 2000   # 글 스냅샷 원문 앞부분 (코드 포인트, V1 varchar(2000))
    detail-max-chars: 200          # 기타 설명 (V1 varchar(200))
    rate-limit:
      per-minute: 5                # FR-009 — ratelimit:report:{memberId}:1m
      per-day: 50                  # ratelimit:report:{memberId}:1d
    retention: 30d                 # 처리된 사건의 스냅샷·설명 보관 (FR-033)
    cleanup-cron: "0 45 4 * * *"   # ShedLock reportSnapshotCleanup
    cleanup-batch-size: 1000
    admin-page-size: 20
    suspension-durations: [P1D, P7D, P30D, PERMANENT]
    suspension-reason-max-chars: 200

  # AI 태그 추천 (013 research R15, data-model §6). 키는 환경 변수 GEMINI_API_KEY로만 — 비어 있으면 공개 글도 자체 AI(Ollama)로 간다.
  # 배포 확인 (T005, 배포 담당 답 전 가정값): Ollama용 메모리 2~4GB 추가 가능, num-thread는 배포 서버 성능 코어 수 이하(기본 4),
  # Gemini 무료 등급 하루 한도는 태평양 시간 0시 초기화(quota-zone), 모델 이름은 콘솔 값으로 바꾼다. 배포 서버 측정 뒤 다시 적는다
  ai:
    tag-suggest:
      enabled: ${BLOG_AI_TAG_SUGGEST_ENABLED:true}
      prompt-version: 1                 # 지시문을 바꾸면 올린다 (같은 내용 재사용 키가 바뀜)
      min-input-chars: 100
      max-suggestions: 5
      daily-limit-per-member: 20
      cache:
        exact-ttl: 30d
        post-ttl: 7d
        similarity-threshold: 0.9
        post-input-chars: 8000
      popular:
        size: 50
        ttl: 1d
      gemini:
        base-url: https://generativelanguage.googleapis.com
        model: ${BLOG_AI_TAG_SUGGEST_GEMINI_MODEL:gemini-flash-lite}
        api-key: ${GEMINI_API_KEY:}
        daily-limit: 450
        quota-zone: America/Los_Angeles
        connect-timeout: 3s
        timeout: 10s
        cooldown: 60s
        unknown-429-exhaust-count: 3
        max-input-chars: 8000
      ollama:
        enabled: ${BLOG_AI_TAG_SUGGEST_OLLAMA_ENABLED:true}
        base-url: ${BLOG_AI_TAG_SUGGEST_OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_MODEL:qwen2.5:1.5b}
        num-thread: ${BLOG_AI_TAG_SUGGEST_OLLAMA_NUM_THREAD:4}
        connect-timeout: 3s
        timeout: 30s
        max-input-chars: 2000
        max-concurrency: 1

# ---------------------------------------------------------------------------
# Redis 회로 차단기 (002 research B-5): 연결 실패·시간 초과 비율 50%/최근 20회 → 30초 열림 → 반열림 5회 시험
# 실패로 세는 예외는 shared.infra.redis.RedisGuard가 직접 고른다(OOM은 세지 않음).
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: false
        register-health-indicator: false
