openapi: 3.1.0
info:
  title: 신고·관리자 숨김·회원 정지 API (014-report-hide)
  version: 0.1.0
  description: |
    원문: docs/43-report-hide.md §2·§3·§6, docs/42-permission-matrix.md P-6·P-10·P-11·§3·§8, docs/13 §2-5, docs/20 §3-5, docs/02 §5-1(O8).

    공통 규칙
    - 현재 사용자는 세션에서만 꺼낸다. 상태를 바꾸는 요청은 `X-XSRF-TOKEN` 헤더(001), 없거나 틀리면 403 CSRF_REJECTED.
    - 신고 판정 순서: 401 → 403(계정 상태) → 400 형식 → 404(볼 수 없는 대상) → 400 CANNOT_REPORT_OWN → 400 기타 설명 → 429(맨 끝).
    - `/api/admin/**`: 비회원 401(있는 주소·없는 주소 같음), 로그인한 일반 회원 404 고정 본문(004 관리자 경로 규칙). 탈퇴 유예 세션은 001 게이트가 먼저 403.
    - 관리자 응답에도 현재 원문은 없다. 스냅샷과 현재 상태 이름만 준다.
    - 작성자에게 가는 응답에는 신고자 정보가 없다. 관리자 상세도 신고자 번호·이름 없이 수와 기타 설명·시각만 준다.
    - 오류 본문은 공통 형식 {code, message, errors, details}. errors는 항상 배열, 메시지 끝에 마침표 없음.
servers:
  - url: http://localhost:8080
    description: 로컬 Docker Compose
tags:
  - name: reports
    description: 신고
  - name: admin-reports
    description: 관리자 — 신고 사건
  - name: admin-hide
    description: 관리자 — 직접 숨김·해제
  - name: admin-members
    description: 관리자 — 회원 정지
paths:
  /api/reports:
    post:
      tags: [reports]
      operationId: createReport
      summary: 글·댓글 신고
      description: |
        이메일 인증한 회원(관리자 포함)만. 같은 대상의 대기 사건에 같은 회원이 다시 신고하면 아무것도 바뀌지 않고 200.
        처리된 뒤의 신고는 새 사건이 된다. 접수는 알림을 만들지 않는다. 회원당 1분 5건·하루 50건(Redis 장애면 통과).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
            examples:
              spam: { value: { targetType: POST, targetId: 123, reason: SPAM, detail: null } }
              other: { value: { targetType: COMMENT, targetId: 77, reason: OTHER, detail: 다른 사람 전화번호가 적혀 있어요 } }
      responses:
        '200':
          description: 접수됨 (새 신고·중복 모두). 화면 문구 "신고가 접수됐어요. 검토 후 처리할게요"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportAccepted' }
              example: { accepted: true }
        '400':
          description: 형식 오류, 기타인데 설명 없음(칸 오류), 자기 콘텐츠
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                own:
                  value: { code: CANNOT_REPORT_OWN, message: 내 글이나 댓글은 신고할 수 없어요, errors: [], details: null }
                detailRequired:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력한 내용을 확인해 주세요
                    errors: [{ field: detail, code: REPORT_DETAIL_REQUIRED, message: 기타 사유를 적어 주세요 }]
                    details: null
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/reports:
    get:
      tags: [admin-reports]
      operationId: listReportCases
      summary: 신고 사건 목록 (대기·처리됨)
      description: |
        PENDING 탭: 대기 사건을 신고 수 많은 순 → 최근 신고 순으로 20개씩. HANDLED 탭: 처리·자동 종료 시각 최근 순.
        넘기는 사이 신고 수가 바뀌면 같은 사건이 다시 보일 수 있다(화면이 사건 번호로 거름).
      security:
        - sessionCookie: []
      parameters:
        - name: tab
          in: query
          required: false
          schema: { type: string, enum: [PENDING, HANDLED], default: PENDING }
        - name: cursor
          in: query
          required: false
          description: 앞 페이지의 nextCursor (목록 구분 `admin-reports:{tab}`)
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: 한 페이지
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CaseListItem' }
                  nextCursor: { type: [string, 'null'] }
              example:
                items:
                  - caseId: 41
                    targetType: POST
                    title: 무료 강의 링크 모음
                    authorHandle: spam_writer
                    reportCount: 7
                    reasonCounts: { SPAM: 6, OTHER: 1 }
                    lastReportedAt: '2026-10-08T02:10:00Z'
                    status: PENDING
                    handledAt: null
                    handledByNickname: null
                    targetHiddenNow: false
                nextCursor: null
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/reports/{caseId}:
    get:
      tags: [admin-reports]
      operationId: getReportCase
      summary: 신고 사건 상세
      description: 스냅샷·현재 상태·신고 수·사유별 수·기타 설명·작성자 정보. 현재 원문은 주지 않는다
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/reports/{caseId}/resolution:
    post:
      tags: [admin-reports]
      operationId: resolveReportCase
      summary: 처리 (숨기기·문제없음)
      description: |
        그 사건의 대기 신고를 모두 같은 결과로 닫는다. 숨기기면 대상을 숨기고 작성자에게 숨김 알림 1개, 신고자마다 결과 알림(011).
        먼저 처리한 것만 반영하고 늦은 요청은 409. 대상이 이미 사라졌으면 "대상 없음"으로 닫고 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolutionRequest' }
            examples:
              hide: { value: { action: HIDE, reason: SPAM } }
              reject: { value: { action: REJECT, reason: null } }
      responses:
        '200':
          description: 처리됨 (처리 뒤 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
        '400':
          description: 형식 오류(숨기기인데 사유 없음 등), 자기 콘텐츠, 자기 혼자 신고한 사건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                own:
                  value: { code: CANNOT_MODERATE_OWN, message: 내 글이나 댓글은 처리할 수 없어요, errors: [], details: null }
                onlyMine:
                  value: { code: CANNOT_HANDLE_OWN_REPORT, message: 내가 혼자 신고한 건은 처리할 수 없어요, errors: [], details: null }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 처리됨 또는 대상 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                handled:
                  value: { code: REPORT_ALREADY_HANDLED, message: 이미 처리된 신고예요, errors: [], details: { status: HIDDEN } }
                noTarget:
                  value: { code: REPORT_ALREADY_HANDLED, message: 이미 처리된 신고예요, errors: [], details: { status: CLOSED_NO_TARGET } }

  /api/admin/posts/{postId}/hidden:
    put:
      tags: [admin-hide]
      operationId: hidePost
      summary: 글 직접 숨김
      description: |
        관리자가 볼 수 있는 글만(남의 비공개 글은 404). 대기 사건이 있으면 그 사건을 숨김으로 닫고(신고자 알림), 없으면 신고 없는 사건을 만들어 바로 숨김으로 닫는다.
        작성자에게 숨김 알림 1개. 이미 숨김이면 200 그대로(사건·알림 없음).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HideRequest' }
            example: { reason: COPYRIGHT }
      responses:
        '200':
          description: 숨김 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
              example: { hidden: true, caseId: 52 }
        '400': { $ref: '#/components/responses/ModerateOwn' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-hide]
      operationId: unhidePost
      summary: 글 숨김 해제
      description: 숨김이 아니면 200 그대로. 사건 기록은 그대로 두고 알림을 보내지 않는다. 좋아요·댓글·목록 위치는 숨기기 전과 같다
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 해제 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
              example: { hidden: false, caseId: null }
        '400': { $ref: '#/components/responses/ModerateOwn' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/comments/{commentId}/hidden:
    put:
      tags: [admin-hide]
      operationId: hideComment
      summary: 댓글 직접 숨김
      description: 글 숨김과 같다. 관리자가 볼 수 있는 정상 댓글만(삭제된 자리·탈퇴 작성자 댓글·볼 수 없는 글의 댓글은 404). 글의 댓글 수가 1 줄어든다
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HideRequest' }
      responses:
        '200':
          description: 숨김 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
        '400': { $ref: '#/components/responses/ModerateOwn' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-hide]
      operationId: unhideComment
      summary: 댓글 숨김 해제
      description: 글의 댓글 수가 1 늘어난다. 알림 없음
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 해제 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
        '400': { $ref: '#/components/responses/ModerateOwn' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/members/{handle}:
    get:
      tags: [admin-members]
      operationId: getAdminMember
      summary: 회원 정보·정지 이력
      description: 탈퇴 유예 회원도 보인다(상태 WITHDRAWN). 익명 처리된 회원·없는 주소는 404
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '200':
          description: 회원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemberView' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/members/{handle}/suspensions:
    post:
      tags: [admin-members]
      operationId: suspendMember
      summary: 회원 정지
      description: |
        정지하는 순간 그 회원의 모든 기기 세션을 끊는다. 세션 저장소 장애로 끊지 못하면 정지도 하지 않고 503.
        알림 없음. 정지 회원의 글·댓글은 그대로 보인다.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Handle'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRequest' }
            example: { duration: P7D, reason: 스팸 글 반복 게시 }
      responses:
        '201':
          description: 정지됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemberView' }
        '400':
          description: 형식 오류(사유 없음·200자 초과·기간 밖), 관리자, 탈퇴 유예
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                admin:
                  value: { code: CANNOT_SUSPEND_ADMIN, message: 관리자는 정지할 수 없어요, errors: [], details: null }
                withdrawn:
                  value: { code: CANNOT_SUSPEND_WITHDRAWN, message: 탈퇴 신청한 회원은 정지할 수 없어요, errors: [], details: null }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 정지 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: ALREADY_SUSPENDED, message: 이미 정지된 회원이에요, errors: [], details: null }
        '503':
          description: 세션을 끊지 못해 정지하지 않음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: TEMPORARILY_UNAVAILABLE, message: 잠시 후 다시 시도해 주세요, errors: [], details: null }

  /api/admin/members/{handle}/suspensions/current:
    delete:
      tags: [admin-members]
      operationId: liftSuspension
      summary: 정지 해제
      description: 해제한 관리자와 시각을 기록한다. 열린 정지가 없어도 200. 알림 없음
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Handle'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 해제 뒤 회원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemberView' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      description: 숫자가 아니면 404
      schema: { type: string, pattern: '^[0-9]+$' }
    CommentId:
      name: commentId
      in: path
      required: true
      description: 숫자가 아니면 404
      schema: { type: string, pattern: '^[0-9]+$' }
    CaseId:
      name: caseId
      in: path
      required: true
      description: 숫자가 아니면 404
      schema: { type: string, pattern: '^[0-9]+$' }
    Handle:
      name: handle
      in: path
      required: true
      description: 블로그 주소(대소문자 무시)
      schema: { type: string, maxLength: 40 }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: CSRF 토큰 (`XSRF-TOKEN` 쿠키 값, 001)
      schema: { type: string }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session(Redis) 세션 쿠키. HttpOnly, Secure, SameSite=Lax (02 §5).

  headers:
    RetryAfter:
      description: 다시 시도할 수 있을 때까지 남은 초
      schema: { type: integer, minimum: 1 }

  responses:
    LoginRequired:
      description: 비회원
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: LOGIN_REQUIRED, message: 로그인이 필요해요, errors: [], details: null }
    Forbidden:
      description: |
        계정 상태 거부(001 `AccountStatusGuard`) 또는 CSRF 거부. 판정 순서상 404보다 먼저다(42 §3).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            emailNotVerified:
              value: { code: EMAIL_NOT_VERIFIED, message: 이메일 인증 후 이용할 수 있어요, errors: [], details: null }
            withdrawn:
              value: { code: ACCOUNT_WITHDRAWN, message: 탈퇴 신청한 계정이에요, errors: [], details: null }
            suspended:
              value: { code: ACCOUNT_SUSPENDED, message: 정지된 계정이에요, errors: [], details: null }
            csrfRejected:
              value: { code: CSRF_REJECTED, message: 요청을 확인하지 못했어요. 페이지를 새로 고친 뒤 다시 시도해 주세요, errors: [], details: null }
    NotFound:
      description: 없음·볼 수 없음·남의 것. 본문은 모든 경우 같다(README 2026-10-07).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 볼 수 없는 페이지예요, errors: [], details: null }
    TooManyRequests:
      description: 요청 과다. 판정 순서의 맨 끝(007 Q2). 코드는 `TOO_MANY_REQUESTS` 하나(007 Q3).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: TOO_MANY_REQUESTS, message: 잠시 후 다시 시도해 주세요, errors: [], details: null }
    InvalidCursor:
      description: 풀 수 없거나 다른 목록의 커서
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INVALID_CURSOR, message: 목록을 처음부터 다시 불러와 주세요, errors: [], details: null }

    ModerateOwn:
      description: 자기 글·댓글 숨김·해제
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: CANNOT_MODERATE_OWN, message: 내 글이나 댓글은 처리할 수 없어요, errors: [], details: null }

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1 O8). `errors`는 항상 배열(없으면 []), 메시지 끝에 마침표 없음.
      required: [code, message, errors, details]
      properties:
        code: { type: string, description: 대문자 이유 코드 }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        details:
          type: [object, 'null']
    ReportReason:
      type: string
      enum: [SPAM, ABUSE, SEXUAL, PRIVACY, COPYRIGHT, OTHER]
      description: 스팸·광고 / 욕설·혐오 / 음란·선정 / 개인정보 노출 / 저작권 침해 / 기타. 숨김 사유도 같은 목록
    TargetType:
      type: string
      enum: [POST, COMMENT]
    CaseStatus:
      type: string
      enum: [PENDING, HIDDEN, REJECTED, CLOSED_NO_TARGET]
    ReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: '#/components/schemas/TargetType' }
        targetId: { type: integer, format: int64, minimum: 1 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail:
          type: [string, 'null']
          maxLength: 200
          description: 기타일 때 필수(앞뒤 공백 제거 뒤 1자 이상). 다른 사유면 저장하지 않는다
    ReportAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    ReasonCounts:
      type: object
      description: 사유 코드 → 신고 수 (0인 사유는 빠짐)
      additionalProperties: { type: integer, minimum: 1 }
    CaseListItem:
      type: object
      required: [caseId, targetType, title, authorHandle, reportCount, reasonCounts, lastReportedAt, status, handledAt, handledByNickname, targetHiddenNow]
      properties:
        caseId: { type: integer, format: int64 }
        targetType: { $ref: '#/components/schemas/TargetType' }
        title: { type: [string, 'null'], description: '글: 스냅샷 제목, 댓글: 스냅샷 내용 앞 40자. 30일 정리 뒤 null' }
        authorHandle: { type: [string, 'null'], description: 익명 처리된 회원이면 null }
        reportCount: { type: integer, minimum: 0, description: 직접 숨김 사건이면 0 }
        reasonCounts: { $ref: '#/components/schemas/ReasonCounts' }
        lastReportedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/CaseStatus' }
        handledAt: { type: [string, 'null'], format: date-time }
        handledByNickname: { type: [string, 'null'], description: 자동 종료면 null (화면 "자동") }
        targetHiddenNow: { type: boolean }
    CaseDetail:
      type: object
      required: [caseId, targetType, postId, commentId, snapshotTitle, snapshotContent, currentState, status, createdAt, handledAt, handledByNickname, reportCount, reasonCounts, otherDetails, reportedByMe, onlyMyReport, author]
      properties:
        caseId: { type: integer, format: int64 }
        targetType: { $ref: '#/components/schemas/TargetType' }
        postId: { type: [integer, 'null'], format: int64 }
        commentId: { type: [integer, 'null'], format: int64 }
        snapshotTitle: { type: [string, 'null'] }
        snapshotContent: { type: [string, 'null'], description: 원문 글자 그대로. 화면은 텍스트로만 그린다 }
        currentState:
          type: string
          enum: [PUBLIC, PRIVATE, TRASHED, HIDDEN, AUTHOR_WITHDRAWN, GONE, VISIBLE, DELETED, POST_NOT_VISIBLE]
        status: { $ref: '#/components/schemas/CaseStatus' }
        createdAt: { type: string, format: date-time }
        handledAt: { type: [string, 'null'], format: date-time }
        handledByNickname: { type: [string, 'null'] }
        reportCount: { type: integer, minimum: 0 }
        reasonCounts: { $ref: '#/components/schemas/ReasonCounts' }
        otherDetails:
          type: array
          items:
            type: object
            required: [detail, reportedAt]
            properties:
              detail: { type: [string, 'null'], description: 30일 정리 뒤 null }
              reportedAt: { type: string, format: date-time }
        reportedByMe: { type: boolean }
        onlyMyReport: { type: boolean, description: true면 처리할 수 없음 }
        author:
          type: object
          required: [handle, nickname, joinedAt, hiddenCount, suspendedNow, suspensionCount]
          properties:
            handle: { type: [string, 'null'] }
            nickname: { type: [string, 'null'] }
            joinedAt: { type: string, format: date-time }
            hiddenCount: { type: integer, minimum: 0, description: 숨김으로 닫힌 사건 수 }
            suspendedNow: { type: boolean }
            suspensionCount: { type: integer, minimum: 0 }
    ResolutionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [HIDE, REJECT] }
        reason:
          oneOf:
            - $ref: '#/components/schemas/ReportReason'
            - type: 'null'
          description: HIDE면 필수
    HideRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/ReportReason' }
    HiddenState:
      type: object
      required: [hidden, caseId]
      properties:
        hidden: { type: boolean }
        caseId: { type: [integer, 'null'], format: int64, description: 이번에 숨김으로 닫은 사건 }
    SuspendRequest:
      type: object
      required: [duration, reason]
      properties:
        duration: { type: string, enum: [P1D, P7D, P30D, PERMANENT] }
        reason: { type: string, minLength: 1, maxLength: 200 }
    SuspensionRecord:
      type: object
      required: [id, reason, startedAt, endsAt, suspendedByHandle, liftedAt, liftedByHandle]
      properties:
        id: { type: integer, format: int64 }
        reason: { type: string }
        startedAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time, description: null = 영구 }
        suspendedByHandle: { type: [string, 'null'] }
        liftedAt: { type: [string, 'null'], format: date-time }
        liftedByHandle: { type: [string, 'null'], description: 기한 지남 자동 해제면 null }
    AdminMemberView:
      type: object
      required: [handle, nickname, role, status, joinedAt, hiddenCount, openSuspension, history]
      properties:
        handle: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN] }
        joinedAt: { type: string, format: date-time }
        hiddenCount: { type: integer, minimum: 0 }
        openSuspension:
          oneOf:
            - $ref: '#/components/schemas/SuspensionRecord'
            - type: 'null'
        history:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SuspensionRecord' }
