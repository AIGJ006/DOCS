openapi: 3.1.0
info:
  title: 회원 탈퇴·복구 API (015-withdraw)
  version: 0.1.0
  description: |
    회원 탈퇴 신청·복구 REST 계약. 원문: docs/44-withdraw.md §2·§3, docs/13-delete-withdraw.md §3, docs/42-permission-matrix.md §3·§9·P-12, docs/02-architecture.md §5-1(O8).

    공통 규칙
    - 현재 사용자는 세션에서만 꺼낸다. 다른 회원을 대상으로 하는 경로는 없다.
    - 탈퇴 유예 회원은 001 WithdrawnAccountGateFilter가 허용 목록(POST /api/me/restore, POST /api/auth/logout, GET /api/me, GET /api/auth/csrf) 밖 모든 /api/** 를 403 ACCOUNT_WITHDRAWN details{action: RESTORE}로 막는다. 이 계약의 GET /api/me/withdrawal·POST /api/me/withdraw도 그 대상이다.
    - 신청 판정 순서: 401 → 403(유예·정지) → 409 ADMIN_CANNOT_WITHDRAW → 400 WITHDRAW_CONFIRM_REQUIRED → 본인 확인(429 잠금 → 400 CURRENT_PASSWORD_MISMATCH | 400 CONFIRM_TEXT_MISMATCH). 잠금은 요청 횟수 제한이 아니라 비밀번호 추측 방지라 비밀번호 비교보다 먼저 본다.
    - 오류 본문은 공통 형식 {code, message, errors, details}. errors는 항상 배열, 메시지 끝에 마침표 없음.
    - 상태를 바꾸는 요청은 세션 쿠키 + `X-XSRF-TOKEN` 헤더(001). 없거나 틀리면 403 CSRF_REJECTED.
    - 응답은 모두 `Cache-Control: no-store`.
servers:
  - url: http://localhost:8080
    description: 로컬 Docker Compose
tags:
  - name: withdrawal
    description: 회원 탈퇴·복구
  - name: me
    description: 로그인 상태 요약 (001 확장)
  - name: auth
    description: 가입 (001 확장)
paths:
  /api/me/withdrawal:
    get:
      tags: [withdrawal]
      operationId: getWithdrawalPreview
      summary: 탈퇴 안내 숫자 (FR-003)
      description: |
        탈퇴 화면을 열 때 부른다. 숫자는 이 순간 값이다. 관리자도 볼 수 있다(신청 때 409).
        판정: 401 → 403(유예 게이트, AccountStatusGuard ACCOUNT_WRITE — 이메일 인증 전 통과, 정지 403).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 안내 숫자
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalPreview' }
              example:
                handle: kim755030
                postCount: 24
                commentCount: 18
                receivedLikeCount: 126
                restoreDeadline: '2026-11-07T06:20:00Z'
                verification: PASSWORD
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/me/withdraw:
    post:
      tags: [withdrawal]
      operationId: withdraw
      summary: 탈퇴 신청 (FR-002·FR-005·FR-006·FR-008·FR-009)
      description: |
        성공하면 status = WITHDRAWN, withdrawn_at = now(), 그 회원의 모든 세션 삭제(이 요청의 세션 포함), 커밋 후 MemberWithdrawn과 접수 메일(이메일이 있는 계정만).
        응답 뒤에는 로그인 상태가 아니다. 탈퇴 사유는 받지 않는다(FR-004).
        본인 확인 방법은 GET /api/me/withdrawal의 verification을 따른다. 방법에 맞지 않는 칸은 무시한다.
        비밀번호 실패 기록은 비밀번호 변경(POST /api/me/password)과 합쳐 센다(auth:pw-change-fail:{memberId}, 5번·15분).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawRequest' }
            examples:
              email:
                value: { confirmed: true, password: '********' }
              social:
                value: { confirmed: true, confirmText: 탈퇴 }
      responses:
        '200':
          description: 신청됨. 세션이 끊겼다.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawResult' }
              example: { restoreDeadline: '2026-11-07T06:20:00Z' }
        '400':
          description: |
            `WITHDRAW_CONFIRM_REQUIRED`(확인 체크 없음), `CURRENT_PASSWORD_MISMATCH`(이메일 가입 — 비었거나 틀림, 틀리면 실패로 셈),
            `CONFIRM_TEXT_MISMATCH`(소셜 가입 — "탈퇴"와 다름)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                confirmRequired:
                  value: { code: WITHDRAW_CONFIRM_REQUIRED, message: 안내 내용을 확인하고 체크해 주세요, errors: [], details: null }
                passwordMismatch:
                  value: { code: CURRENT_PASSWORD_MISMATCH, message: 현재 비밀번호가 올바르지 않아요, errors: [], details: null }
                confirmTextMismatch:
                  value: { code: CONFIRM_TEXT_MISMATCH, message: "'탈퇴'를 정확히 입력해 주세요", errors: [], details: null }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 관리자 권한이 있는 회원 (W-6)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: ADMIN_CANNOT_WITHDRAW, message: 관리자 권한을 해제한 뒤 탈퇴할 수 있어요, errors: [], details: null }
        '429':
          description: 현재 비밀번호 5번 연속 실패(비밀번호 변경 화면과 합산) 후 15분
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: PASSWORD_CHANGE_TEMPORARILY_LOCKED, message: 잠시 후 다시 시도해 주세요(약 15분), errors: [], details: null }
        '503':
          description: 세션 저장소 장애로 세션을 지울 수 없음. 신청은 반영되지 않았다(전체 롤백).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: TEMPORARILY_UNAVAILABLE, message: 잠시 후 다시 시도해 주세요, errors: [], details: null }

  /api/me/restore:
    post:
      tags: [withdrawal]
      operationId: restore
      summary: 탈퇴 유예 중 복구 (FR-018·FR-019·FR-021a)
      description: |
        허용 목록 경로. 유예 회원이고 now ≤ withdrawn_at + 30일이면 status = ACTIVE, withdrawn_at = NULL, 커밋 후 MemberRestored와 복구 메일.
        이미 ACTIVE면 200(변화·이벤트 없음). 익명 처리된 회원의 남은 세션은 비로그인 취급이라 401.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 활동 상태
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreResult' }
              example: { status: ACTIVE }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 복구 기한이 지났다(정리 작업이 아직 돌지 않은 사이). 경계는 정리 대상 조건과 같다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: RESTORE_PERIOD_EXPIRED, message: 복구 기한이 지났어요, errors: [], details: null }

  /api/me:
    get:
      tags: [me]
      operationId: getMe
      x-extends: specs/001-account-auth/contracts/openapi.yaml#getMe
      summary: 로그인 상태 요약 — 복구 기한 두 칸 추가 (R6)
      description: |
        001 계약에 restoreDeadline·restoreExpired만 더한다(기존 칸 의미는 그대로). 허용 목록 경로라 유예 회원도 200.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 로그인 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeSummary' }
              examples:
                withdrawn:
                  value:
                    memberId: 42
                    handle: kim755030
                    nickname: 민서
                    role: USER
                    status: WITHDRAWN
                    provider: LOCAL
                    emailVerified: true
                    reagreementRequired: false
                    profileImageUrl: null
                    restoreDeadline: '2026-11-07T06:20:00Z'
                    restoreExpired: false
        '401': { $ref: '#/components/responses/LoginRequired' }

  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signupWithEmail
      x-extends: specs/001-account-auth/contracts/openapi.yaml#signupWithEmail
      summary: 이메일 가입 — 탈퇴 유예 계정 이메일 칸 오류 추가 (FR-022)
      description: |
        001 계약 그대로이고, 같은 이메일의 이메일 가입 계정이 탈퇴 유예 중이면 email 칸 오류 코드가
        EMAIL_ALREADY_REGISTERED 대신 EMAIL_WITHDRAWAL_PENDING이다. 요청 본문·성공 응답은 001 계약을 따른다.
      responses:
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: VALIDATION_FAILED
                message: 입력한 내용을 확인해 주세요
                errors:
                  - { field: email, code: EMAIL_WITHDRAWAL_PENDING, message: 탈퇴 신청한 계정이 있어요. 로그인하면 복구할 수 있어요 }
                details: null

components:
  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: CSRF 토큰 (`XSRF-TOKEN` 쿠키 값, 001)
      schema: { type: string }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session(Redis) 세션 쿠키. HttpOnly, Secure, SameSite=Lax (02 §5).

  headers:
    RetryAfter:
      description: 다시 시도할 수 있을 때까지 남은 초
      schema: { type: integer, minimum: 1 }

  responses:
    LoginRequired:
      description: 비회원
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: LOGIN_REQUIRED, message: 로그인이 필요해요, errors: [], details: null }
    Forbidden:
      description: |
        계정 상태 거부(001 `AccountStatusGuard`) 또는 CSRF 거부. 판정 순서상 404보다 먼저다(42 §3).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            emailNotVerified:
              value: { code: EMAIL_NOT_VERIFIED, message: 이메일 인증 후 이용할 수 있어요, errors: [], details: null }
            withdrawn:
              value: { code: ACCOUNT_WITHDRAWN, message: 탈퇴 신청한 계정이에요, errors: [], details: null }
            suspended:
              value: { code: ACCOUNT_SUSPENDED, message: 정지된 계정이에요, errors: [], details: null }
            csrfRejected:
              value: { code: CSRF_REJECTED, message: 요청을 확인하지 못했어요. 페이지를 새로 고친 뒤 다시 시도해 주세요, errors: [], details: null }
    NotFound:
      description: 없음·볼 수 없음·남의 것. 본문은 모든 경우 같다(README 2026-10-07).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 볼 수 없는 페이지예요, errors: [], details: null }
    TooManyRequests:
      description: 요청 과다. 판정 순서의 맨 끝(007 Q2). 코드는 `TOO_MANY_REQUESTS` 하나(007 Q3).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: TOO_MANY_REQUESTS, message: 잠시 후 다시 시도해 주세요, errors: [], details: null }
    InvalidCursor:
      description: 풀 수 없거나 다른 목록의 커서
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INVALID_CURSOR, message: 목록을 처음부터 다시 불러와 주세요, errors: [], details: null }

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1 O8). `errors`는 항상 배열(없으면 []), 메시지 끝에 마침표 없음.
      required: [code, message, errors, details]
      properties:
        code: { type: string, description: 대문자 이유 코드 }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        details:
          type: [object, 'null']
    WithdrawalPreview:
      type: object
      required: [handle, postCount, commentCount, receivedLikeCount, restoreDeadline, verification]
      properties:
        handle: { type: string, description: 블로그 주소 (다시 쓸 수 없음) }
        postCount: { type: integer, minimum: 0, description: 내 글 전부 — 임시·발행·휴지통·숨김 포함 }
        commentCount: { type: integer, minimum: 0, description: 남의 글에 쓴 지워지지 않은 댓글 }
        receivedLikeCount: { type: integer, minimum: 0, description: 내 글이 받은 좋아요 합 (30일 뒤 삭제) }
        restoreDeadline: { type: string, format: date-time, description: 지금 신청하면의 복구 기한 }
        verification:
          type: string
          enum: [PASSWORD, CONFIRM_TEXT]
          description: PASSWORD = 이메일 가입(현재 비밀번호), CONFIRM_TEXT = 소셜 가입("탈퇴" 입력)
    WithdrawRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, description: 안내 확인 체크. true가 아니면 400 WITHDRAW_CONFIRM_REQUIRED (제안 칸) }
        password: { type: string, writeOnly: true, description: verification = PASSWORD일 때 }
        confirmText: { type: string, maxLength: 20, description: verification = CONFIRM_TEXT일 때. 앞뒤 공백 제거 후 비교 }
      additionalProperties: false
    WithdrawResult:
      type: object
      required: [restoreDeadline]
      properties:
        restoreDeadline: { type: string, format: date-time }
    RestoreResult:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ACTIVE }
    MeSummary:
      type: object
      description: 001 MeSummary + 두 칸
      required: [memberId, handle, nickname, role, status, provider, emailVerified, reagreementRequired, profileImageUrl, restoreDeadline, restoreExpired]
      properties:
        memberId: { type: integer }
        handle: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, WITHDRAWN] }
        provider: { type: string, enum: [LOCAL, GOOGLE, GITHUB] }
        emailVerified: { type: boolean }
        reagreementRequired: { type: boolean }
        profileImageUrl: { type: [string, 'null'] }
        restoreDeadline:
          type: [string, 'null']
          format: date-time
          description: status = WITHDRAWN일 때 withdrawn_at + 30일, 아니면 null
        restoreExpired:
          type: boolean
          description: status = WITHDRAWN이고 지금이 restoreDeadline보다 뒤면 true
