openapi: 3.1.0
info:
  title: 글 읽기 API (005-post-reading)
  version: 0.1.0
  description: |
    전체 글 목록·개인 블로그·글 상세 (C-READ-1, C-BLOG-1, C-READ-2).
    규약: docs/02-architecture.md §5-1 (2026-10-07 O8)
      - 경로 `/api/...` 복수형, 경로 변수 이름 `{postId}`, `{handle}`
      - 오류 본문 `{ code, message, errors, details }` (errors는 입력 검증 오류일 때만)
      - 목록 커서는 불투명 Base64URL 문자열. 클라이언트는 해석하지 않고 그대로 돌려준다
      - 인증은 세션 쿠키(Spring Session) + CSRF 토큰. 이 문서의 API는 모두 GET이라 CSRF 토큰이 필요 없고, 로그인 없이도 호출할 수 있다
        (로그인 정보는 "보는 사람 기준" 필드에만 쓰인다. 세션 저장소 장애 시 비회원으로 처리된다, 02 §2-1)
    이 기능은 서버 이벤트·배치를 만들지 않는다(contracts/events.md 없음).
    관련 API(다른 spec 소유, 여기서 정의하지 않음):
      - POST /api/posts/{postId}/views — 조회 기록(009, 31 §4-2). 상세 화면이 1초 가시성 후 호출
      - GET /api/posts/{postId}/comments[?around={commentId}] — 댓글 첫 20개(007, 21 §6)
      - PUT/DELETE /api/posts/{postId}/like (009), PUT/DELETE /api/members/{handle}/follow (010)
    "제안" 표시가 있는 경로·필드는 원문에 없어 plan에서 정한 것이다(research.md R-22~R-27).
servers:
  - url: http://localhost:8080
tags:
  - name: list
    description: 홈·블로그 글 목록 (10 §4-2)
  - name: blog
    description: 개인 블로그 머리말 (10 §5)
  - name: detail
    description: 글 상세 (40)
  - name: page
    description: 서버 첫 응답 — React index.html + 링크 미리보기 메타 + 상태 코드 (2026-10-07 H7)

paths:
  /api/posts:
    get:
      tags: [list]
      operationId: listHomePosts
      summary: 전체 글 목록 (홈)
      description: |
        공개·발행 글만(휴지통·관리자 숨김·탈퇴 신청 작성자 글 제외, 004 FR-009 공용 조건),
        `first_public_at DESC, id DESC`로 9개. 서버는 10개를 조회해 10개면 9개 + nextCursor, 아니면 nextCursor null.
        SQL 1번, 본문 컬럼 미조회 (C-READ-1 #6).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 카드 목록
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCardPage'
              example:
                items:
                  - id: 42
                    url: /@kim755030/posts/42
                    title: JPA N+1 정리
                    excerpt: 지연 로딩으로 연관 엔티티를 조회할 때 …
                    thumbnailUrl: https://storage.example.com/blog/images/2026/10/3f2a_thumb.webp
                    firstPublicAt: '2026-10-02T14:03:12.123456Z'
                    commentCount: 3
                    likeCount: 12
                    author:
                      handle: kim755030
                      nickname: 김민서
                      profileImageUrl: null
                nextCursor: eyJ2IjoxLCJsIjoiaG9tZSIsImsiOlsxNzkwNzU1MjAwMTIzNDU2LDM3XX0
        '400':
          $ref: '#/components/responses/InvalidCursor'

  /api/members/{handle}:
    get:
      tags: [blog]
      operationId: getBlogHeader
      summary: 개인 블로그 머리말 (제안)
      description: |
        프로필 사진(없으면 null → 화면 기본 아이콘), 닉네임, 블로그 주소, 소개, 보는 사람 기준 공개 글 수.
        공통에서 공개 글 수 = 목록과 같은 공용 조건의 공개·발행 글 수.
        없는 주소·탈퇴 유예·익명 처리 → 404. API는 대문자 주소를 리다이렉트하지 않는다(화면 주소 /@{handle}이 301 처리).
        010(팔로우)은 이 응답에 팔로워 수 등 필드를 추가할 수 있다.
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '200':
          description: 블로그 머리말
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogHeader'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/members/{handle}/posts:
    get:
      tags: [list]
      operationId: listBlogPosts
      summary: 개인 블로그 글 목록
      description: |
        그 사람의 공개·발행 글만, 홈과 같은 카드·정렬·9개. 작성자 본인이 봐도 비공개·숨긴 글은 없다 (06 V-8).
        (FRIENDS 적용자만) 친구가 보면 친구 공개 글 포함, 정렬·커서 키 (published_at, id) — 선택 구현.
      parameters:
        - $ref: '#/components/parameters/Handle'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 카드 목록 (author 필드는 홈과 같이 채워지며 화면이 작성자 영역만 생략)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCardPage'
        '400':
          $ref: '#/components/responses/InvalidCursor'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/posts/{postId}:
    get:
      tags: [detail]
      operationId: getPostDetail
      summary: 글 상세 (제안)
      description: |
        판정: postId가 숫자가 아니면 404 → 글+작성자 조회 → PostAccessPolicy.canRead (004, 42 §3·§5-1) → 불가면 404.
        없는 글·남의 비공개/임시 글·휴지통 글(작성자 포함)·남이 보는 숨긴 글·탈퇴 신청 작성자의 글은 모두 같은 404 본문.
        작성자 본인의 임시글: 200 + status DRAFT + editorPath만(본문 없음) — 화면이 에디터로 이동.
        이 요청은 조회수를 바꾸지 않는다 (40 R-7). content_md는 읽지 않는다.
        쿼리 최대 5번: 글+작성자, 태그, 좋아요 여부, 팔로우 여부, (작성자) 작업본 유무.
        태그·좋아요·팔로우·작업본 조회 실패는 빈 값/false로 대체하고 상세는 계속 응답한다(research R-30).
        댓글은 포함하지 않는다 — 화면이 007 API를 동시에 부른다(research R-33, 007 FR-016 미결).
      parameters:
        - name: postId
          in: path
          required: true
          description: 글 번호. 숫자가 아니면 404 NOT_FOUND (400 아님)
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: 상세 보기
          headers:
            Cache-Control:
              description: 글이 PUBLIC이면 `private, no-cache`, 아니면 `private, no-store` (40 R-9, 06 R-5)
              schema:
                type: string
                enum: ['private, no-cache', 'private, no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /@{handle}:
    get:
      tags: [page]
      operationId: blogPage
      summary: 개인 블로그 화면 첫 응답 (HTML)
      description: |
        React index.html에 링크 미리보기 메타를 넣어 반환한다(H7, research R-25·R-27).
        ① handle에 대문자 → 301 소문자 주소(쿼리 문자열 유지) ② 없는 주소·탈퇴 유예·익명 처리 → 404 + 공통 404 메타 + noindex ③ 200.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: index.html (메타 포함, 본문은 React가 그림)
          content:
            text/html:
              schema:
                type: string
        '301':
          $ref: '#/components/responses/MovedPermanently'
        '404':
          $ref: '#/components/responses/NotFoundPage'

  /@{handle}/posts/{postId}:
    get:
      tags: [page]
      operationId: postDetailPage
      summary: 글 상세 화면 첫 응답 (HTML)
      description: |
        40 §3 순서: ① handle 대문자 → 301 소문자 주소 ② postId가 숫자가 아님 → 404
        ③ 글+작성자 조회 → canRead → 불가 404 ④ handle ≠ 작성자 handle → 301 /@{올바른 handle}/posts/{postId}
        ⑤ 작성자 본인의 임시글 → 302 /write/{postId} ⑥ 200.
        볼 수 없는 글에는 ④를 하지 않는다. ①·④의 301은 쿼리 문자열을 유지한다(research R-32).
        canonical에는 쿼리 문자열(`?utm_source=`, `?comment=`)을 넣지 않는다. 조회수를 바꾸지 않는다.
        200 공개 글 메타: <title>{제목} - {닉네임}</title>, description(excerpt 앞 160자), canonical, og:type=article,
        og:title, og:description, og:image(첫 사진 원본, 없으면 기본 이미지), article:published_time(first_public_at),
        article:modified_time(edited_at, 있을 때만). 값은 HTML 속성 이스케이프.
        작성자 본인이 보는 비공개·숨김 글: 공통 문구 + noindex, `private, no-store`.
        인라인 스크립트 없음 (CSP script-src 'self').
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: postId
          in: path
          required: true
          schema:
            type: string
        - name: comment
          in: query
          required: false
          description: 알림 링크의 댓글 표시 값. 댓글 영역(007 `around`)에만 넘기고 canonical에 넣지 않는다
          schema:
            type: string
      responses:
        '200':
          description: index.html (메타 포함)
          headers:
            Cache-Control:
              description: PUBLIC이면 `private, no-cache`, 아니면 `private, no-store`
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '301':
          $ref: '#/components/responses/MovedPermanently'
        '302':
          description: 작성자 본인의 임시글 → 에디터
          headers:
            Location:
              schema:
                type: string
                example: /write/42
        '404':
          $ref: '#/components/responses/NotFoundPage'

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        이전 응답의 nextCursor를 그대로. 첫 페이지는 생략.
        서버 내부 형식(클라이언트는 해석 금지): 패딩 없는 Base64URL(JSON {"v":1,"l":"home"|"blog:{handle}","k":[epoch 마이크로초, id]}).
        `l`은 다른 목록 커서 판별용 추가 제안(research R-24).
        풀리지 않음·모르는 v·필드 누락·타입 오류·다른 목록의 커서 → 400 INVALID_CURSOR.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
    Size:
      name: size
      in: query
      required: false
      description: 받기는 하지만 무시한다. 서버는 항상 설정값(기본 9)으로 고정 (10 §4-2)
      schema:
        type: integer
    Handle:
      name: handle
      in: path
      required: true
      description: 블로그 주소(소문자). 형식은 member.handle CHECK (08 §7)
      schema:
        type: string
        maxLength: 39

  headers:
    CachePrivateNoCache:
      description: '`private, no-cache` (research R-31)'
      schema:
        type: string
        const: 'private, no-cache'

  responses:
    InvalidCursor:
      description: 잘못된 커서
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_CURSOR
            message: 목록 위치 값이 올바르지 않아요.
            errors: []
            details: null
    NotFound:
      description: 없음 또는 볼 수 없음 (구분하지 않음, 42 §4)
      headers:
        Cache-Control:
          schema:
            type: string
            const: 'private, no-store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: 볼 수 없는 페이지예요.
            errors: []
            details: null
    NotFoundPage:
      description: |
        공통 404 화면(index.html) + 06 §3-1 메타. 없는 글·볼 수 없는 글·없는 블로그가 바이트 단위로 같은 본문:
          <meta property="og:title" content="볼 수 없는 글이에요">
          <meta property="og:description" content="친구 공개·비공개 글이거나 삭제된 글입니다.">
          <meta name="robots" content="noindex">
      headers:
        Cache-Control:
          schema:
            type: string
            const: 'private, no-store'
      content:
        text/html:
          schema:
            type: string
    MovedPermanently:
      description: 정규 주소로 영구 이동 (쿼리 문자열 유지)
      headers:
        Location:
          schema:
            type: string
            example: /@kim755030/posts/42?comment=120

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1, O8)
      required: [code, message]
      properties:
        code:
          type: string
          description: 대문자 이유 코드
          enum: [INVALID_CURSOR, NOT_FOUND]
        message:
          type: string
        errors:
          type: array
          description: 입력 검증 오류일 때만
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        details:
          description: 추가 정보 (선택)
          type: [object, 'null']

    AuthorSummary:
      type: object
      required: [handle, nickname, profileImageUrl]
      properties:
        handle:
          type: string
        nickname:
          type: string
        profileImageUrl:
          type: [string, 'null']
          format: uri
          description: 작은 프로필 사진(썸네일, 없으면 원본). 없으면 null → 화면 기본 아이콘

    PostCard:
      type: object
      description: 글 카드 (10 §2·§4-2). 본문은 포함하지 않는다
      required: [id, url, title, excerpt, thumbnailUrl, firstPublicAt, commentCount, likeCount, author]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: /@{handle}/posts/{id}
        title:
          type: string
          maxLength: 100
        excerpt:
          type: [string, 'null']
          maxLength: 200
        thumbnailUrl:
          type: [string, 'null']
          description: 640px 썸네일(옛 사진은 원본). null이면 같은 크기 빈 영역
        firstPublicAt:
          type: string
          format: date-time
          description: 최초 공개 일자(UTC). 카드 날짜·정렬 기준
        commentCount:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        author:
          $ref: '#/components/schemas/AuthorSummary'

    PostCardPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/PostCard'
        nextCursor:
          type: [string, 'null']
          description: 더 있으면 다음 위치, 없으면 null(버튼 숨김 + "모든 글을 다 봤어요")

    BlogHeader:
      type: object
      description: 개인 블로그 머리말 (제안, research R-23)
      required: [handle, nickname, bio, profileImageUrl, publicPostCount, isMe]
      properties:
        handle:
          type: string
        nickname:
          type: string
        bio:
          type: [string, 'null']
          maxLength: 200
          description: 글자만, 줄바꿈 유지
        profileImageUrl:
          type: [string, 'null']
        publicPostCount:
          type: integer
          minimum: 0
          description: 보는 사람 기준 공개 글 수(공통에서는 공개·발행 글 수)
        isMe:
          type: boolean
          description: 보는 사람이 블로그 주인인지 (빈 상태 문구 선택용)

    PostDetail:
      type: object
      description: 글 상세 (제안, research R-22, 필드는 40 §2). status가 DRAFT(작성자 본인)이면 id·status·editorPath만 채운다
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PUBLISHED, DRAFT]
        editorPath:
          type: [string, 'null']
          description: status가 DRAFT일 때만 /write/{postId}
        canonicalPath:
          type: string
          description: /@{작성자 handle}/posts/{id}. 화면 주소의 handle과 다르면 화면이 replace 이동
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
          description: 공통 값. FRIENDS 적용자는 FRIENDS 추가
        title:
          type: string
          description: 글자 그대로(화면에서 텍스트로 출력, h1)
        contentHtml:
          type: string
          description: 발행 때 정화된 HTML(post.content_html), 수정 중이어도 마지막 발행본
        hasCodeBlock:
          type: boolean
          description: 본문에 코드 블록이 있으면 true → 화면이 코드 강조 도구를 그때만 로드 (제안)
        displayedAt:
          type: string
          format: date-time
          description: PUBLIC이면 firstPublicAt, 작성자가 보는 PRIVATE이면 publishedAt (40 R-6)
        firstPublicAt:
          type: [string, 'null']
          format: date-time
        publishedAt:
          type: string
          format: date-time
        editedAt:
          type: [string, 'null']
          format: date-time
          description: 값이 있을 때만 "수정됨 · M월 D일"
        tags:
          type: array
          description: 입력 순서(position)대로. 링크 /tags/{인코딩된 이름}
          items:
            type: string
        likeCount:
          type: integer
          minimum: 0
        viewCount:
          type: integer
          format: int64
          minimum: 0
          description: 저장값 그대로(이번 방문의 +1을 기다리지 않음)
        commentCount:
          type: integer
          minimum: 0
        author:
          allOf:
            - $ref: '#/components/schemas/AuthorSummary'
            - type: object
              properties:
                bio:
                  type: [string, 'null']
                  description: 작성자 카드 소개(글자만, 줄바꿈 유지)
        viewer:
          type: object
          required: [loggedIn, isAuthor, likedByMe, followingAuthor]
          properties:
            loggedIn:
              type: boolean
            isAuthor:
              type: boolean
