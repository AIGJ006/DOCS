openapi: 3.1.0
info:
  title: 이미지 업로드 API (003-image-upload)
  version: 0.1.0
  description: |
    C-IMG-1 사진 업로드 REST 계약. 원문: docs/04-draft-and-image.md §4, docs/23-image.md, docs/02-architecture.md §5-1(O8).

    공통 규칙
    - 현재 사용자는 세션에서만 꺼낸다. 요청에 회원을 가리키는 값은 없다.
    - 판정 순서(42 §3, README 2026-10-07, 007 Q2): 401 LOGIN_REQUIRED → 403 계정 상태(EMAIL_NOT_VERIFIED·ACCOUNT_WITHDRAWN·ACCOUNT_SUSPENDED)
      → 404(남의 사진·없는 사진) → 400 입력·검사 → 409 STORAGE_QUOTA_EXCEEDED → 429 DAILY_UPLOAD_LIMIT → 429 TOO_MANY_REQUESTS.
    - 오류 본문은 공통 형식 {code, message, errors, details}. errors는 항상 배열, 메시지 끝에 마침표 없음.
    - 상태를 바꾸는 요청은 세션 쿠키 + `X-XSRF-TOKEN` 헤더가 필요하다(001). 없거나 틀리면 403 CSRF_REJECTED.
    - 원래 파일 이름을 받는 칸은 없다(FR-009).
    - 사진 파일 자체(저장소 공개 주소)는 이 API가 아니라 저장소가 내준다. 주소를 알면 누구나 읽을 수 있다(04 결정 2, FR-025).

    업로드 방식 (research R2)
    - DIRECT(기본): presign 응답의 upload.url은 저장소 Presigned PUT 주소다. 브라우저가 그 주소로 직접 PUT한다.
    - PROXY(운영 저장소가 CORS를 허용하지 않을 때): upload.url은 이 API의 `/api/images/{imageId}/content`다. 화면 코드는 같다.
servers:
  - url: http://localhost:8080
    description: 로컬 Docker Compose
security:
  - sessionCookie: []
tags:
  - name: images
    description: 사진 업로드
  - name: storage
    description: 내 사진 저장 공간
paths:
  /api/images/presign:
    post:
      tags: [images]
      operationId: presignImageUpload
      summary: 업로드 준비 (권한 발급)
      description: |
        형식·크기·저장 공간·하루 장수·1분 장수를 확인한 뒤 `image` 행(TEMP)을 만들고 업로드 주소를 준다.
        - 주소는 `presign-ttl`(기본 5분) 뒤 만료된다(FR-005).
        - 하루 장수는 이 요청이 통과하는 순간 1장 늘어나며, 이후 업로드·완료 확인이 실패해도 돌려주지 않는다(FR-016).
        - 용량은 "지금 사용량 + size + thumbSize"로 판정한다. 같은 회원의 동시 요청은 직렬화되어 합계가 한도를 넘지 않는다(FR-015).
        - purpose=PROFILE이면 contentType은 image/webp, size ≤ 1MB, 썸네일 칸을 보내지 않는다(001, research R14).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignRequest' }
            examples:
              post:
                value: { purpose: POST, contentType: image/webp, size: 412345, thumbContentType: image/webp, thumbSize: 38211 }
              safariFallback:
                summary: WebP를 만들지 못한 브라우저 (Q4)
                value: { purpose: POST, contentType: image/jpeg, size: 498000, thumbContentType: image/jpeg, thumbSize: 52000 }
              gif:
                value: { purpose: POST, contentType: image/gif, size: 3100000, thumbContentType: image/webp, thumbSize: 41000 }
              profile:
                value: { purpose: PROFILE, contentType: image/webp, size: 23000 }
      responses:
        '201':
          description: 업로드 주소 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageUploadTicket' }
              example:
                imageId: 9001
                upload:
                  url: http://localhost:9000/blog/images/2026/10/3f1c2a9e-8d7b-4c1e-9a55-0b6f2a1d7e44.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=300&X-Amz-SignedHeaders=cache-control%3Bcontent-length%3Bcontent-type%3Bhost&X-Amz-Signature=…
                  method: PUT
                  headers: { Content-Type: image/webp, Cache-Control: 'public, max-age=31536000, immutable' }
                thumbUpload:
                  url: http://localhost:9000/blog/images/2026/10/3f1c2a9e-8d7b-4c1e-9a55-0b6f2a1d7e44_thumb.webp?X-Amz-…
                  method: PUT
                  headers: { Content-Type: image/webp, Cache-Control: 'public, max-age=31536000, immutable' }
                expiresAt: '2026-10-08T05:05:00Z'
        '400':
          description: 입력 칸 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                type:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력한 내용을 확인해 주세요
                    errors: [{ field: contentType, code: UNSUPPORTED_IMAGE_TYPE, message: 'jpg, png, gif, webp 사진만 올릴 수 있어요' }]
                    details: null
                size:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력한 내용을 확인해 주세요
                    errors: [{ field: size, code: IMAGE_TOO_LARGE, message: 사진은 10MB까지 올릴 수 있어요 }]
                    details: null
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 저장 공간 초과 (FR-015)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: STORAGE_QUOTA_EXCEEDED
                message: 사진 저장 공간(1GB)을 다 썼어요. 쓰지 않는 사진이 든 글을 지우면 7일 뒤 공간이 돌아와요
                errors: []
                details: { usedBytes: 1073000000, quotaBytes: 1073741824 }
        '429':
          description: 하루 한도(DAILY_UPLOAD_LIMIT) 또는 1분 20장(TOO_MANY_REQUESTS). Redis 장애 중에는 나오지 않는다.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                daily:
                  value: { code: DAILY_UPLOAD_LIMIT, message: 오늘은 사진을 200장까지 올릴 수 있어요. 내일 다시 시도해 주세요, errors: [], details: { dailyLimit: 200 } }
                perMinute:
                  value: { code: TOO_MANY_REQUESTS, message: 잠시 후 다시 시도해 주세요, errors: [], details: null }
        '503':
          description: |
            Redis 메모리 부족 등 일시 장애(research R9). 현재 구현은 002 RedisGuard 때문에 code가 AUTOSAVE_UNAVAILABLE일 수 있다.
            화면은 code와 상관없이 "잠시 후 다시 시도해 주세요"로 보이고 기기에 보관한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/images/{imageId}/complete:
    post:
      tags: [images]
      operationId: completeImageUpload
      summary: 업로드 완료 확인 (서버 검사)
      description: |
        업로더 확인(아니면 404) → 두 파일의 존재·실제 크기 → 매직 바이트 형식 → 해상도(머리말) → GIF 프레임 수를 확인한다(FR-006~FR-008, FR-037).
        - 실패하면 두 파일과 행을 지우고 400을 준다. 하루 장수는 돌려주지 않는다.
        - 이미 완료된 사진이면 검사 없이 같은 200을 준다(멱등, research R24).
        - 응답의 url을 본문에 그대로 넣는다(절대 주소, FR-010).
      parameters:
        - $ref: '#/components/parameters/ImageId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 검사 통과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedImage' }
              example:
                imageId: 9001
                url: http://localhost:9000/blog/images/2026/10/3f1c2a9e-8d7b-4c1e-9a55-0b6f2a1d7e44.webp
                thumbUrl: http://localhost:9000/blog/images/2026/10/3f1c2a9e-8d7b-4c1e-9a55-0b6f2a1d7e44_thumb.webp
                contentType: image/webp
                width: 1920
                height: 1440
                sizeBytes: 412345
        '400':
          description: 파일 없음(만료 포함) 또는 검사 실패. 파일과 행은 이미 지워졌다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                notUploaded:
                  value: { code: IMAGE_NOT_UPLOADED, message: 사진이 올라가지 않았어요. 다시 시도해 주세요, errors: [], details: null }
                disguised:
                  summary: 확장자 위장 (US1 #3)
                  value: { code: IMAGE_REJECTED, message: 올릴 수 없는 사진이에요, errors: [], details: { reason: TYPE_MISMATCH } }
                gifFrames:
                  value: { code: IMAGE_REJECTED, message: 올릴 수 없는 사진이에요, errors: [], details: { reason: GIF_TOO_MANY_FRAMES } }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/images/{imageId}/content:
    put:
      tags: [images]
      operationId: putImageContent
      summary: (대체안 PROXY 모드 전용) 원본을 서버 경유로 올리기
      description: |
        `blog.image.upload-mode = PROXY`일 때만 존재한다(DIRECT면 404). 업로더 확인 → 신고 크기까지만 스트림 복사 → 저장소 PutObject.
        Content-Type은 presign 때 신고한 값과 같아야 한다. 이어서 complete를 부른다(research R2).
      parameters:
        - $ref: '#/components/parameters/ImageId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '204': { description: 저장됨 }
        '400':
          description: 신고 크기 초과·형식 불일치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/images/{imageId}/thumb-content:
    put:
      tags: [images]
      operationId: putImageThumbContent
      summary: (대체안 PROXY 모드 전용) 썸네일을 서버 경유로 올리기
      description: content와 같은 규칙. 썸네일이 없는 사진(PROFILE)이면 404.
      parameters:
        - $ref: '#/components/parameters/ImageId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '204': { description: 저장됨 }
        '400':
          description: 신고 크기 초과·형식 불일치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/storage:
    get:
      tags: [storage]
      operationId: getMyStorageUsage
      summary: 내 사진 저장 공간·오늘 올린 장수·한도 값
      description: |
        usedBytes = 내가 올린 모든 사진(TEMP·연결·연결 해제 대기·프로필)의 원본 + 썸네일 크기 합(FR-014).
        todayCount는 Redis 값이며 장애면 null. limits는 화면의 고르는 순간 검사와 90% 안내에 쓴다(research R25).
        이메일 인증 전 회원도 볼 수 있다(보기만).
      responses:
        '200':
          description: 사용량
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageUsage' }
              example:
                usedBytes: 327155712
                quotaBytes: 1073741824
                todayCount: 12
                dailyLimit: 200
                limits: { maxUploadBytes: 10485760, maxThumbBytes: 1048576, maxSourceBytes: 52428800, longSide: 1920, thumbMaxWidth: 640, gifMaxSide: 1920, gifMaxFrames: 300 }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: CSRF 토큰 (`XSRF-TOKEN` 쿠키 값, 001)
      schema: { type: string }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session(Redis) 세션 쿠키. HttpOnly, Secure, SameSite=Lax (02 §5).

  headers:
    RetryAfter:
      description: 다시 시도할 수 있을 때까지 남은 초
      schema: { type: integer, minimum: 1 }

  responses:
    LoginRequired:
      description: 비회원
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: LOGIN_REQUIRED, message: 로그인이 필요해요, errors: [], details: null }
    Forbidden:
      description: |
        계정 상태 거부(001 `AccountStatusGuard`) 또는 CSRF 거부. 판정 순서상 404보다 먼저다(42 §3).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            emailNotVerified:
              value: { code: EMAIL_NOT_VERIFIED, message: 이메일 인증 후 이용할 수 있어요, errors: [], details: null }
            withdrawn:
              value: { code: ACCOUNT_WITHDRAWN, message: 탈퇴 신청한 계정이에요, errors: [], details: null }
            suspended:
              value: { code: ACCOUNT_SUSPENDED, message: 정지된 계정이에요, errors: [], details: null }
            csrfRejected:
              value: { code: CSRF_REJECTED, message: 요청을 확인하지 못했어요. 페이지를 새로 고친 뒤 다시 시도해 주세요, errors: [], details: null }
    NotFound:
      description: 없음·볼 수 없음·남의 것. 본문은 모든 경우 같다(README 2026-10-07).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 볼 수 없는 페이지예요, errors: [], details: null }
    TooManyRequests:
      description: 요청 과다. 판정 순서의 맨 끝(007 Q2). 코드는 `TOO_MANY_REQUESTS` 하나(007 Q3).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: TOO_MANY_REQUESTS, message: 잠시 후 다시 시도해 주세요, errors: [], details: null }
    InvalidCursor:
      description: 풀 수 없거나 다른 목록의 커서
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INVALID_CURSOR, message: 목록을 처음부터 다시 불러와 주세요, errors: [], details: null }

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1 O8). `errors`는 항상 배열(없으면 []), 메시지 끝에 마침표 없음.
      required: [code, message, errors, details]
      properties:
        code: { type: string, description: 대문자 이유 코드 }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        details:
          type: [object, 'null']

    ImagePurpose:
      type: string
      enum: [POST, PROFILE]
    ImageContentType:
      type: string
      enum: [image/jpeg, image/png, image/gif, image/webp]
    ThumbContentType:
      type: string
      enum: [image/webp, image/jpeg]
      description: 썸네일은 WebP, 브라우저가 WebP를 만들지 못하면 JPEG (Q4)

    PresignRequest:
      type: object
      additionalProperties: false
      required: [purpose, contentType, size]
      properties:
        purpose: { $ref: '#/components/schemas/ImagePurpose' }
        contentType: { $ref: '#/components/schemas/ImageContentType' }
        size: { type: integer, minimum: 1, maximum: 10485760, description: 실제로 올릴 원본 바이트 수 (Q3) }
        thumbContentType: { $ref: '#/components/schemas/ThumbContentType' }
        thumbSize: { type: integer, minimum: 1, maximum: 1048576 }
      description: purpose=POST이면 thumbContentType·thumbSize가 필수, PROFILE이면 둘 다 없어야 한다.

    UploadTarget:
      type: object
      required: [url, method, headers]
      properties:
        url: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers:
          type: object
          description: 브라우저가 PUT에 그대로 붙일 헤더(서명에 포함). Content-Length는 브라우저가 자동으로 넣는다.
          additionalProperties: { type: string }

    ImageUploadTicket:
      type: object
      required: [imageId, upload, thumbUpload, expiresAt]
      properties:
        imageId: { type: integer, format: int64 }
        upload: { $ref: '#/components/schemas/UploadTarget' }
        thumbUpload:
          oneOf:
            - { $ref: '#/components/schemas/UploadTarget' }
            - { type: 'null' }
        expiresAt: { type: string, format: date-time }

    UploadedImage:
      type: object
      required: [imageId, url, thumbUrl, contentType, width, height, sizeBytes]
      properties:
        imageId: { type: integer, format: int64 }
        url: { type: string, format: uri, description: 지금의 공개 주소 + storage_key }
        thumbUrl: { type: [string, 'null'], format: uri }
        contentType: { $ref: '#/components/schemas/ImageContentType' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sizeBytes: { type: integer, minimum: 1 }

    StorageUsage:
      type: object
      required: [usedBytes, quotaBytes, todayCount, dailyLimit, limits]
      properties:
        usedBytes: { type: integer, format: int64, minimum: 0 }
        quotaBytes: { type: integer, format: int64 }
        todayCount: { type: [integer, 'null'], minimum: 0 }
        dailyLimit: { type: integer }
        limits:
          type: object
          required: [maxUploadBytes, maxThumbBytes, maxSourceBytes, longSide, thumbMaxWidth, gifMaxSide, gifMaxFrames]
          properties:
            maxUploadBytes: { type: integer }
            maxThumbBytes: { type: integer }
            maxSourceBytes: { type: integer }
            longSide: { type: integer }
            thumbMaxWidth: { type: integer }
            gifMaxSide: { type: integer }
            gifMaxFrames: { type: integer }
