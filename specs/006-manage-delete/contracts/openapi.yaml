openapi: 3.1.0
info:
  title: 내 글 관리·글 삭제·휴지통 API (006-manage-delete)
  version: 0.1.0
  description: |
    C-MANAGE-1(내 글 관리)과 C-POST-5(글 삭제·휴지통) REST 계약.
    원문: docs/41-manage-posts.md §5, docs/13-delete-withdraw.md §2-4, docs/02-architecture.md §5-1 (O8 API 규약),
    docs/42-permission-matrix.md §3·§4.

    공통 규칙
    - 현재 사용자는 세션에서만 꺼낸다. 사용자를 가리키는 요청 값(authorId 등)은 받지 않고, 들어와도 무시한다.
    - 판정 순서 (42 §3): 401 LOGIN_REQUIRED → 403 ACCOUNT_WITHDRAWN·ACCOUNT_SUSPENDED → 404 NOT_FOUND(없음·남의 글·상태 불일치).
      이메일 인증 전 회원도 이 API를 모두 쓸 수 있다 (42 §5-2·§10).
    - 오류 본문은 공통 형식 {code, message, errors, details} (O8).
    - 목록 커서는 불투명 Base64URL 문자열. 클라이언트는 해석하지 않고 그대로 돌려보낸다. 잘못된 커서는 400 INVALID_CURSOR.
    - 상태를 바꾸는 요청(POST·PUT·PATCH·DELETE)은 세션 쿠키 + CSRF 토큰 헤더가 필요하다. 001 기본안(R-05): `XSRF-TOKEN` 쿠키 값을 `X-XSRF-TOKEN` 헤더로 보낸다. 없거나 틀리면 403 `CSRF_REJECTED`(제안 코드).

    이 계약에 없는 관리 화면 동작 (다른 spec의 계약을 호출만 함)
    - [공개 범위 ▾]  PUT /api/posts/{postId}/visibility (004 plan 결정, O8 규약: 같은 값 재전송은 변화 없이 200,
                     잘못된 값은 소유 확인(404) 뒤 400 INVALID_VISIBILITY) → specs/004-visibility-permission/contracts
    - [변경 취소]    작업본 삭제 (04 §2-5) → specs/002-post-authoring/contracts
    - [새 글]        DRAFT 행 생성 (04 §2-5) → specs/002-post-authoring/contracts
servers:
  - url: http://localhost:8080
    description: 로컬 Docker Compose
security:
  - sessionCookie: []
tags:
  - name: manage
    description: 내 글 관리 목록 (C-MANAGE-1)
  - name: trash
    description: 글 삭제·복구·영구 삭제 (C-POST-5)
paths:
  /api/me/posts:
    get:
      tags: [manage]
      operationId: listMyPosts
      summary: 내 글 관리 목록 (탭별, 20개씩)
      description: |
        로그인한 본인의 글만 돌려준다 (41 M-2). 정렬은 다음과 같다 (41 M-4).
        - drafts·published: updated_at 최신순, 같으면 id 큰 순
        - trash: deleted_at 최신순, 같으면 id 큰 순

        서버는 21개를 조회해 20개와 nextCursor를 준다. 클라이언트가 보낸 size 등의 값은 무시한다.
        counts는 cursor가 없는 첫 요청에만 계산하고, [더 보기] 응답에서는 null이다.
        본문(content_md, content_html)은 읽지도 돌려주지도 않는다 (FR-012).
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [drafts, published, trash]
            default: drafts
        - name: visibility
          in: query
          required: false
          description: tab=published일 때만 적용. 없으면 [전체]. 다른 탭에서는 무시한다.
          schema:
            type: string
            enum: [public, private]
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 목록 한 페이지
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagePostPage' }
              examples:
                firstPage:
                  value:
                    items:
                      - id: 42
                        title: Spring Security 로그인 정리
                        status: PUBLISHED
                        visibility: PUBLIC
                        editing: true
                        hidden: false
                        updatedAt: '2026-10-03T05:03:12.123456Z'
                        publishedAt: '2026-10-01T01:00:00Z'
                        editedAt: '2026-10-03T05:00:00Z'
                        deletedAt: null
                        purgeAt: null
                        viewCount: 120
                        likeCount: 12
                        commentCount: 3
                    nextCursor: eyJ2IjoxLCJrIjpbMTc5MDc1NTIwMDEyMzQ1NiwzN10sInQiOiJwdWJsaXNoZWQiLCJmIjoiYWxsIn0
                    counts: { drafts: 3, published: 24, trash: 1 }
        '400':
          description: |
            INVALID_CURSOR (풀 수 없거나 다른 탭·필터의 커서), INVALID_TAB (제안 — research R20),
            INVALID_VISIBILITY (public|private 이외)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountWithdrawn' }

  /api/me/trash:
    get:
      tags: [manage]
      operationId: listMyTrash
      summary: 휴지통 목록 (별칭 — GET /api/me/posts?tab=trash 와 같은 조회)
      description: |
        13 §2-4·02 §5-1에 적힌 경로. 41 §5와 같은 Service 메서드·같은 응답 형식을 쓰는 별칭이며,
        tab=trash로 고정된다. 휴지통 항목에서는 id, title, status, deletedAt, purgeAt이 의미 있다.
        제안 (팀 확인 필요): 경로를 하나로 정하면 이 별칭은 지운다 (research R15).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 휴지통 한 페이지
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagePostPage' }
        '400':
          description: INVALID_CURSOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountWithdrawn' }

  /api/posts/{postId}:
    delete:
      tags: [trash]
      operationId: trashPost
      summary: 글 삭제 (휴지통으로, 빈 임시글은 바로 완전 삭제)
      description: |
        처리 순서 (13 §2-3·§2-4, research R4·R7·R8)
        1. author_id = 현재 사용자 조건으로 행 잠금(FOR UPDATE)
        2. Redis 자동 저장분을 DB에 반영
        3. 빈 임시글 판정
        4. deleted_at = now() 또는 완전 삭제
        5. 커밋 후 Redis 키 삭제

        결과
        - 정상 글: 휴지통으로 옮기고 trashed 응답을 준다. 이벤트 PostTrashed를 발행한다.
        - 빈 임시글 (DRAFT이고 제목·본문 모두 공백): 바로 완전 삭제하고 purged 응답을 준다. 이벤트는 없다.
        - 이미 휴지통인 글: 아무것도 바꾸지 않고 trashed 응답을 준다. purgeAt은 기존 값이고 이벤트는 없다 (FR-025).
        - 남의 글·없는 글: 404이며 글은 바뀌지 않는다.
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 휴지통으로 옮겼거나(또는 이미 휴지통) 바로 완전 삭제함
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TrashedResult'
                  - $ref: '#/components/schemas/PurgedResult'
              examples:
                trashed:
                  value: { trashed: true, purgeAt: '2026-11-01T05:03:12.123456Z' }
                purgedEmptyDraft:
                  value: { purged: true }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountWithdrawn' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/posts/{postId}/restore:
    post:
      tags: [trash]
      operationId: restorePost
      summary: 휴지통에서 복구
      description: |
        deleted_at = NULL로 되돌린다. 다음 값은 바꾸지 않는다:
        status, visibility, first_public_at, hidden_at, updated_at.
        그래서 원래 탭·원래 목록 위치로 돌아간다 (13 D-4). 이벤트 PostRestored를 발행한다.
        휴지통에 없는 글·남의 글·없는 글은 404다.
        응답 본문은 제안이다 (팀 확인 필요, research R19). 화면이 "복구했어요 [… 탭에서 보기]"의 이동 탭을 고르는 데 쓴다.
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 복구함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoredResult' }
              example: { restored: true, status: PUBLISHED, visibility: PUBLIC }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountWithdrawn' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/posts/{postId}/permanent:
    delete:
      tags: [trash]
      operationId: purgePost
      summary: 영구 삭제 (휴지통 글만)
      description: |
        완전 삭제 순서 (13 §2-5, research R10)
        1. PENDING 신고 사건(그 글·그 글의 댓글 대상)을 CLOSED_NO_TARGET으로 바꾼다
        2. 그 글에서만 쓰던 사진에 image.detached_at을 기록한다
        3. DELETE FROM post를 실행한다. post_tag·comment·post_like·post_image·post_draft·post_view_daily·notification은 CASCADE로,
           report_case 대상은 SET NULL로 처리된다. tag 행은 남는다.

        이벤트 PostPurged를 발행한다. 휴지통에 없는 글·남의 글·없는 글은 404다.
        응답 본문은 제안이다 (팀 확인 필요, research R19).
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 완전히 지움
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurgedResult' }
              example: { purged: true }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountWithdrawn' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session(Redis) 세션 쿠키. HttpOnly, Secure, SameSite=Lax (02 §5).

  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        이전 응답의 nextCursor를 그대로 넣는다. 첫 페이지는 생략한다.
        서버 내부 형식은 Base64URL(JSON)이다 (research R16, 001 CursorCodec): {"v":1,"l":"manage:{tab}[:{filter}]","k":[epochMicros,id]}
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: CSRF 토큰. 헤더 이름은 M17 확정 전 가정이다 (쿠키 저장 방식 기준).
      schema: { type: string }

  responses:
    LoginRequired:
      description: 비회원 (React는 로그인 화면으로 보내고 돌아올 주소를 넘긴다)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: LOGIN_REQUIRED, message: 로그인이 필요해요, errors: [], details: null }
    AccountWithdrawn:
      description: 계정 상태 거부(001 `AccountStatusGuard.requireActive(me, CONTENT_CLEANUP)` — 이메일 인증 전은 통과). 탈퇴 유예 회원(복구 화면으로 안내), 정지 직후 남은 세션(H7), CSRF 토큰 없음·틀림
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            withdrawn:
              value: { code: ACCOUNT_WITHDRAWN, message: 탈퇴 신청한 계정이에요, errors: [], details: null }
            suspended:
              value: { code: ACCOUNT_SUSPENDED, message: 정지된 계정이에요., errors: [], details: null }
            csrfRejected:
              value: { code: CSRF_REJECTED, message: 요청을 확인할 수 없어요. 새로고침 후 다시 시도해 주세요., errors: [], details: null }
    NotFound:
      description: 없는 글, 남의 글, 상태가 맞지 않는 글(복구·영구 삭제 대상이 휴지통에 없음). 응답은 모두 같다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 볼 수 없는 페이지예요, errors: [], details: null }

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1 O8)
      required: [code, message]
      properties:
        code:
          type: string
          description: 대문자 이유 코드
          examples: [LOGIN_REQUIRED, ACCOUNT_WITHDRAWN, NOT_FOUND, INVALID_CURSOR, INVALID_VISIBILITY, INVALID_TAB]
        message: { type: string }
        errors:
          type: array
          description: 입력 검증 오류일 때만
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        details:
          description: 추가 정보 (선택)
          type: [object, 'null']

    PostStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    Visibility:
      type: string
      enum: [PUBLIC, PRIVATE]
      description: 친구 공개 규격 적용자는 FRIENDS가 더해진다 (06 §6, 개인 확장)

    ManagePostItem:
      type: object
      description: 관리 목록 한 줄 (41 §5). 본문 필드는 없다.
      additionalProperties: false
      required: [id, title, status, visibility, editing, hidden, updatedAt, viewCount, likeCount, commentCount]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 100, description: 빈 문자열이면 화면이 "(제목 없음)" }
        status: { $ref: '#/components/schemas/PostStatus' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        editing: { type: boolean, description: post_draft 존재 (수정 중) }
        hidden: { type: boolean, description: 관리자 숨김 (hidden_at IS NOT NULL) }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        editedAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time, description: 휴지통 탭에서만 값 }
        purgeAt: { type: [string, 'null'], format: date-time, description: deletedAt + 보관 기간(기본 30일), 휴지통 탭에서만 값 }
        viewCount: { type: integer, format: int64, minimum: 0 }
        likeCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }

    ManageCounts:
      type: object
      required: [drafts, published, trash]
      properties:
        drafts: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0, description: 숨긴 글 포함, 공개/비공개 필터와 무관 }
        trash: { type: integer, minimum: 0 }

    ManagePostPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ManagePostItem' }
        nextCursor:
          type: [string, 'null']
          description: 다음 페이지가 없으면 null ([더 보기] 숨김)
        counts:
          description: 첫 요청(cursor 없음)에만 값, [더 보기]에서는 null
          oneOf:
            - $ref: '#/components/schemas/ManageCounts'
            - type: 'null'

    TrashedResult:
      type: object
      required: [trashed, purgeAt]
      additionalProperties: false
      properties:
        trashed: { type: boolean, const: true }
        purgeAt: { type: string, format: date-time, description: 완전 삭제 예정 시각 (실제 삭제는 그 뒤 첫 새벽 배치) }

    PurgedResult:
      type: object
      required: [purged]
      additionalProperties: false
      properties:
        purged: { type: boolean, const: true }

    RestoredResult:
      type: object
      required: [restored, status, visibility]
      additionalProperties: false
      properties:
        restored: { type: boolean, const: true }
        status: { $ref: '#/components/schemas/PostStatus' }
        visibility: { $ref: '#/components/schemas/Visibility' }
