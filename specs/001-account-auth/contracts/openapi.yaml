  /api/members/{handle}/friend:
    parameters:
      - $ref: '#/components/parameters/Handle'
    get:
      tags: [friends]
      operationId: getFriendship
      x-origin: proposed
      summary: 나와 이 회원의 친구 관계 + 최근 활동 (FR-054·060)
      description: |
        블로그 머리말의 [친구 요청] 버튼 상태와 최근 활동 표시용. `lastActive`는 친구(ACCEPTED) + 두 사람 모두 공개 + 값 있음일 때만 들어가고,
        아니면 **키 자체가 없다**. 정확한 시각은 어떤 경우에도 없다.
      responses:
        '200':
          description: 관계 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipView' }
              examples:
                friends: { value: { status: FRIENDS, lastActive: { bucket: DAYS_AGO, days: 3 } } }
                pending: { value: { status: REQUEST_SENT } }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [friends]
      operationId: requestOrAcceptFriendship
      x-origin: proposed
      summary: 친구 요청 / 받은 요청 수락 (FR-054·055)
      description: |
        관계가 없으면 요청(PENDING), 상대가 이미 보낸 요청이 있으면 바로 수락(ACCEPTED), 이미 친구이거나 내가 보낸 요청이면 변화 없음.
        동시에 서로 요청해도 관계는 하나. 받은 요청 목록의 [수락]도 이 요청이다. 이메일 인증은 필요 없다(spec 가정).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 처리 후 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipView' }
        '400':
          description: '`CANNOT_FRIEND_SELF`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountState' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [friends]
      operationId: removeFriendship
      x-origin: proposed
      summary: 받은 요청 거절 / 보낸 요청 취소 / 친구 끊기 (FR-055·056)
      description: 관계 행을 지운다. 상대에게 알리지 않고 이벤트도 없다. 관계가 없어도 200(같은 결과). 끊은 순간부터 서로의 최근 활동이 보이지 않는다.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 관계 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipView' }
              example: { status: NONE }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/friends:
    get:
      tags: [friends]
      operationId: listMyFriends
      x-origin: proposed
      summary: 내 친구 목록 — 본인만 (FR-056)
      description: 주소에 회원 값이 없다. 다른 회원의 친구 목록을 보는 경로는 없다. 페이지당 SQL 1번(회원·프로필 사진 JOIN).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 친구 목록 (수락 일자 최신순)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FriendItem' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountState' }

  /api/me/friend-requests:
    get:
      tags: [friends]
      operationId: listReceivedFriendRequests
      x-origin: proposed
      summary: 받은 친구 요청 목록 (설정 화면, FR-055)
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 받은 요청 (요청 일자 최신순)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FriendRequestItem' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/AccountState' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session 세션 쿠키 (HttpOnly, Secure, SameSite=Lax). 14일, 마지막 활동부터.

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: '`XSRF-TOKEN` 쿠키 값 (M17 미결 — research R-05 기본안). 없거나 다르면 403'
      schema: { type: string }
    Handle:
      name: handle
      in: path
      required: true
      description: 블로그 주소 (`go-`·`gi-` 접두어 포함, 소문자)
      schema: { type: string, pattern: '^((go|gi)-)?[a-z0-9][a-z0-9_]{1,34}[a-z0-9]$' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 불투명 Base64URL 커서. 해석하지 말고 그대로 돌려준다
      schema: { type: string }

  headers:
    RetryAfter:
      description: 다시 시도할 수 있을 때까지의 초
      schema: { type: integer, minimum: 1 }

  responses:
    LoginRequired:
      description: '`LOGIN_REQUIRED` — 비로그인(세션을 읽지 못한 Redis 장애 포함). 화면은 로그인 화면으로 안내'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: LOGIN_REQUIRED, message: 로그인이 필요해요, errors: [], details: null }
    AccountState:
      description: |
        계정 상태 거부 또는 CSRF 실패. `ACCOUNT_SUSPENDED`(남은 세션), `ACCOUNT_WITHDRAWN`(탈퇴 유예, 015),
        `REAGREEMENT_REQUIRED`(재동의 전, 허용 목록 밖 요청 — 제안), `EMAIL_NOT_VERIFIED`(콘텐츠 쓰기 — 이 기능의 API에는 해당 없음, 다른 모듈이 `AccountStatusGuard`로 사용)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CsrfRejected:
      description: CSRF 토큰 없음·불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`NOT_FOUND` — 없는 주소, 탈퇴 유예·익명 처리된 회원 (존재 여부를 드러내지 않음)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCursor:
      description: '`INVALID_CURSOR`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: '`TOO_MANY_REQUESTS` — 요청 제한 초과 ("잠시 후 다시 시도해 주세요")'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TemporarilyUnavailable:
      description: '`TEMPORARILY_UNAVAILABLE` — Redis 장애로 새 로그인·토큰 확인·토큰 발급을 할 수 없음 ("잠시 후 다시 시도해 주세요", 02 §2-1, 제안 코드)'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SocialSignupExpired:
      description: '`SOCIAL_SIGNUP_EXPIRED` — 대기 중인 소셜 가입 정보가 없거나 10분이 지남. 다시 소셜 로그인 (제안 코드)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1, O8)
      required: [code, message, errors, details]
      properties:
        code:
          type: string
          description: 대문자 이유 코드
          examples: [VALIDATION_FAILED, LOGIN_REQUIRED, EMAIL_NOT_VERIFIED, ACCOUNT_SUSPENDED, NOT_FOUND]
        message: { type: string }
        errors:
          type: [array, 'null']
          description: 입력 검증 오류일 때만
          items: { $ref: '#/components/schemas/FieldError' }
        details:
          type: [object, 'null']
          additionalProperties: true
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    MessageOnly:
      type: object
      required: [message]
      properties:
        message: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: 32바이트 난수 Base64URL }
    Provider:
      type: string
      enum: [LOCAL, GOOGLE, GITHUB]
    Visibility:
      type: string
      enum: [PUBLIC, PRIVATE]
      description: 친구 공개 규격 적용자는 FRIENDS 추가 (선택 구현)
    AgreementConsent:
      type: object
      required: [termsVersion, privacyVersion]
      description: 동의한 문서 버전. 현재 버전과 같아야 한다
      properties:
        termsVersion: { type: string, maxLength: 20 }
        privacyVersion: { type: string, maxLength: 20 }
    AgreementDocument:
      type: object
      required: [version, effectiveDate, path]
      properties:
        version: { type: string }
        effectiveDate: { type: string, format: date }
        path: { type: string, examples: [/terms, /privacy] }
    EmailSignupRequest:
      type: object
      required: [email, handle, password, passwordConfirm, nickname, agreements]
      properties:
        email: { type: string, maxLength: 254, description: 앞뒤 공백 제거·소문자로 저장 }
        handle:
          type: string
          description: 접두어 없는 주소. 영문 소문자·숫자·`_` 3~36자, 처음·끝은 영문 소문자나 숫자
        password: { type: string, writeOnly: true, minLength: 8, maxLength: 16 }
        passwordConfirm: { type: string, writeOnly: true }
        nickname: { type: string, description: 서버가 앞뒤 공백 제거·NFC 정규화 후 검사·저장 }
        agreements: { $ref: '#/components/schemas/AgreementConsent' }
    SignupResult:
      type: object
      required: [handle, nickname, emailVerified]
      properties:
        handle: { type: string }
        nickname: { type: string }
        emailVerified: { type: boolean }
    LoginResult:
      type: object
      required: [redirectTo, reagreementRequired, accountStatus]
      properties:
        redirectTo: { type: string, description: 검사를 통과한 사이트 안 상대 경로 또는 `/` }
        reagreementRequired: { type: boolean, description: true면 화면은 `/reagree`로 이동 }
        accountStatus:
          type: string
          enum: [ACTIVE, WITHDRAWN]
          description: WITHDRAWN(탈퇴 유예)이면 화면은 복구 화면으로 (015)
    SocialSignupDraft:
      type: object
      required: [provider, handlePrefix, suggestedHandleBody, suggestedNickname, emailRequired, existingAccountNotice, expiresAt]
      properties:
        provider: { type: string, enum: [GOOGLE, GITHUB] }
        handlePrefix: { type: string, enum: [go-, gi-], description: 화면에 고칠 수 없는 고정 글자로 표시 }
        suggestedHandleBody: { type: string, description: 08 §3 ①~⑩ 결과에서 접두어를 뺀 본문 }
        suggestedNickname:
          type: [string, 'null']
          description: 소셜 이름에서 허용되지 않는 문자를 지우고 10자로 자른 값. 09 §3 검사를 통과하지 못하면 null("닉네임을 입력해 주세요")
        email: { type: [string, 'null'], description: 제공자가 확인한 이메일 (읽기 전용 표시) }
        emailRequired: { type: boolean, description: GitHub에 확인된 대표 이메일이 없으면 true — 이메일 입력 칸 표시 }
        profilePhotoUrl:
          type: [string, 'null']
          description: |
            미리보기용 소셜 사진 주소. 서버가 HTTPS + `lh3.googleusercontent.com`/`avatars.githubusercontent.com`인지 확인한 경우만,
            크기 매개변수(Google `=s256-c`, GitHub `&s=256`) 포함. `emailRequired`이면 null(인증 전이라 업로드 불가, research R-20)
        existingAccountNotice:
          type: boolean
          description: 제공자가 확인한 이메일과 같은 이메일의 다른 수단 계정이 있으면 true → "이 이메일로 가입한 계정이 이미 있어요" + [기존 계정으로 로그인]·[새 계정 만들기] (FR-033)
        expiresAt: { type: string, format: date-time, description: 대기 정보 만료 시각(10분) }
    SocialSignupRequest:
      type: object
      required: [handleBody, nickname, agreements, useProfilePhoto]
      properties:
        handleBody: { type: string, description: 접두어를 뺀 본문만. 서버가 가입 수단의 접두어를 붙인다 }
        nickname: { type: string }
        email: { type: [string, 'null'], maxLength: 254, description: '`emailRequired`일 때만 필수, 아니면 무시' }
        useProfilePhoto: { type: boolean, default: true }
        agreements: { $ref: '#/components/schemas/AgreementConsent' }
    SocialSignupResult:
      type: object
      required: [handle, nickname, emailVerified, redirectTo]
      properties:
        handle: { type: string }
        nickname: { type: string }
        emailVerified: { type: boolean }
        profilePhotoUrl:
          type: [string, 'null']
          description: '`useProfilePhoto`가 true이고 가져올 수 있을 때만. 브라우저가 이 주소를 받아 003 흐름으로 복사한다. 서버는 이 주소를 저장하지 않는다'
        redirectTo: { type: string }
    HandleAvailability:
      type: object
      required: [available, reason, suggestion]
      properties:
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [HANDLE_INVALID_FORMAT, HANDLE_RESERVED, HANDLE_BANNED_WORD, HANDLE_DUPLICATE, null]
        suggestion:
          type: [string, 'null']
          description: 예약어·중복일 때 `_2`, `_3` … 중 비어 있는 첫 번호를 붙인 대안 주소
    NicknameAvailability:
      type: object
      required: [available, code]
      properties:
        available: { type: boolean }
        code:
          type: [string, 'null']
          enum: [NICKNAME_INVALID_FORMAT, NICKNAME_LETTER_REQUIRED, NICKNAME_RESERVED, NICKNAME_BANNED_WORD, NICKNAME_DUPLICATE, null]
    MeSummary:
      type: object
      required: [memberId, handle, nickname, role, status, provider, emailVerified, reagreementRequired, profileImageUrl]
      properties:
        memberId: { type: integer, format: int64, description: '본인 회원 번호. 로그아웃 때 브라우저 임시 글 키 draft:{memberId}:* 삭제용(FR-041, 002 clearMemberDrafts)' }
        handle: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, WITHDRAWN] }
        provider: { $ref: '#/components/schemas/Provider' }
        emailVerified: { type: boolean }
        reagreementRequired: { type: boolean }
        profileImageUrl: { type: [string, 'null'], description: null이면 화면이 기본 아바타(닉네임 첫 글자 + 8색)를 그린다 }
    MyProfile:
      type: object
      required: [handle, nickname, bio, profileImageId, profileImageUrl, nicknameChangeAvailableAt]
      properties:
        handle: { type: string, description: 읽기 전용 }
        nickname: { type: string }
        bio: { type: [string, 'null'] }
        profileImageId: { type: [integer, 'null'], format: int64 }
        profileImageUrl: { type: [string, 'null'] }
        nicknameChangeAvailableAt:
          type: [string, 'null']
          format: date-time
          description: null이면 지금 바꿀 수 있음. 아니면 "다음 변경 가능일"로 표시하고 닉네임 칸 비활성화
    ProfileUpdateRequest:
      type: object
      description: 바꾸려는 칸만 보낸다. 알 수 없는 필드(예 `memberId`)는 무시
      minProperties: 1
      properties:
        nickname: { type: string }
        bio: { type: [string, 'null'], description: '코드 포인트 0~200, 줄 4개 이하' }
        profileImageId: { type: [integer, 'null'], format: int64, description: null이면 기본 이미지로 }
    MySettings:
      type: object
      required: [email, provider, previousLogin, defaultVisibility, lastActiveVisible, passwordChangeAvailable]
      properties:
        email: { type: [string, 'null'], description: 읽기 전용 }
        provider: { $ref: '#/components/schemas/Provider' }
        previousLogin:
          description: 이번 로그인 바로 전 로그인. null이면 "첫 로그인"
          oneOf:
            - type: 'null'
            - type: object
              required: [at, provider]
              properties:
                at: { type: string, format: date-time }
                provider: { $ref: '#/components/schemas/Provider' }
        defaultVisibility: { $ref: '#/components/schemas/Visibility' }
        lastActiveVisible: { type: boolean }
        passwordChangeAvailable: { type: boolean, description: 'LOCAL만 true — 아니면 [비밀번호 변경] 버튼을 보이지 않음' }
    SettingsUpdateRequest:
      type: object
      minProperties: 1
      properties:
        defaultVisibility: { $ref: '#/components/schemas/Visibility' }
        lastActiveVisible: { type: boolean }
    LastActive:
      type: object
      description: 정확한 시각은 넣지 않는다. Asia/Seoul 달력 날짜 기준
      required: [bucket]
      properties:
        bucket: { type: string, enum: [TODAY, YESTERDAY, DAYS_AGO, OVER_A_WEEK] }
        days: { type: integer, minimum: 2, maximum: 6, description: bucket이 DAYS_AGO일 때만 }
    FriendshipView:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SELF, NONE, REQUEST_SENT, REQUEST_RECEIVED, FRIENDS]
        lastActive:
          $ref: '#/components/schemas/LastActive'
          description: 표시 조건을 만족할 때만 존재하는 키 (FR-060)
    FriendItem:
      type: object
      required: [handle, nickname, profileImageUrl, friendsSince]
      properties:
        handle: { type: string }
        nickname: { type: string }
        profileImageUrl: { type: [string, 'null'] }
        friendsSince: { type: string, format: date-time }
        lastActive:
          $ref: '#/components/schemas/LastActive'
          description: 표시 조건을 만족할 때만 존재하는 키
    FriendRequestItem:
      type: object
      required: [handle, nickname, profileImageUrl, requestedAt]
      properties:
        handle: { type: string }
        nickname: { type: string }
        profileImageUrl: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }

security:
  - sessionCookie: []
