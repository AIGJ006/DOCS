openapi: 3.1.0
info:
  title: 글 작성·임시저장·발행 API (002-post-authoring)
  version: 0.1.0
  description: |
    팀 공통 Tier A C-POST-1·2·3. 원문: docs/04 §2, docs/05 §4~§6, docs/12 §7-6, docs/02 §5-1(API 공통 규약), docs/42 §3~§5-2.

    공통 규칙
    - 인증: 세션 쿠키(Spring Session + Redis). 상태를 바꾸는 요청(POST·PUT·DELETE)은 CSRF 토큰 헤더 필수.
      CSRF 토큰 저장 방식은 M17에서 확정한다. 이 계약은 Spring Security 기본 `X-XSRF-TOKEN` 헤더를 가정한다.
    - 현재 사용자는 세션에서만 꺼낸다. 요청 본문에 작성자 ID가 없다(보내도 무시).
    - 판정 순서(42 §3): 401 LOGIN_REQUIRED → 403 EMAIL_NOT_VERIFIED / ACCOUNT_WITHDRAWN → 404 NOT_FOUND → 400 / 409 / 422.
    - 남의 글·없는 글·휴지통 글은 모두 같은 404 NOT_FOUND이고 글은 바뀌지 않는다(관리자 포함).
    - 오류 본문은 ErrorResponse `{code, message, errors, details}` 하나다(02 §5-1, O8).
    - "제안(팀 확인 필요)" 표시가 있는 경로·코드는 원문에 없어 plan이 정한 기본값이다(research.md B-1·B-2·B-8).
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
tags:
  - name: editor
    description: 새 글, 에디터 열기, 수동 저장, 변경 취소
  - name: autosave
    description: 자동 저장(서버 쪽 임시 보관)
  - name: publish
    description: 발행·다시 발행
  - name: markdown
    description: 서버 렌더러 미리보기

paths:
  /api/posts:
    post:
      tags: [editor]
      operationId: createPost
      summary: 새 글(임시글) 만들기 — 경로는 제안(팀 확인 필요)
      description: |
        [새 글]을 누르는 즉시 그 회원 소유의 DRAFT 행을 만든다(edit_version = 0, visibility = member.default_visibility).
        본문을 주면 그 내용으로 만든다 — 비교 창의 [새 임시글로 따로 저장](FR-024).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: 임시글 생성됨
          headers:
            Location:
              description: /api/posts/{postId}/working-copy
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingCopy'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/posts/{postId}/working-copy:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [editor]
      operationId: getWorkingCopy
      summary: 에디터 열기 — 경로는 제안(팀 확인 필요)
      description: |
        작성자만. 임시글이면 글 자체, 발행 글이면 작업본(post_draft, 없으면 발행본)을 돌려준다.
        내용과 version은 현재 버전 = max(Redis, post_draft, post)의 출처에서 가져온다.
      responses:
        '200':
          description: 편집할 내용
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingCopy'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [editor]
      operationId: saveWorkingCopy
      summary: 수동 저장 — 경로는 제안(팀 확인 필요)
      description: |
        자동 저장과 같은 버전 확인을 거친 뒤 즉시 DB에 반영한다(D-3). 임시글은 post, 발행 글은 post_draft.
        버전이 다르면 저장하지 않고 409 VERSION_CONFLICT + 서버 내용.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [editor]
      operationId: discardWorkingCopy
      summary: 변경 취소(작업본 버리기) — 경로는 제안(팀 확인 필요)
      description: |
        발행 글의 post_draft와 서버 쪽 임시 보관분을 버린다. 독자가 보던 발행본은 그대로다(FR-035).
        작업본이 없어도 204(여러 번 보내도 결과가 같다). 임시글(DRAFT)에는 409 NOT_PUBLISHED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 작업본 없음 상태가 됨
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 임시글에는 변경 취소가 없다 (제안)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: NOT_PUBLISHED
                message: 발행한 글만 변경을 취소할 수 있어요.
                errors: []
                details: null

  /api/posts/{postId}/autosave:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [autosave]
      operationId: autosave
      summary: 자동 저장 (04 §2-3)
      description: |
        Redis에 버전 확인 + 저장(Lua, 원자적). 받아들이면 version + 1.
        Redis 키가 있어도 매 요청 DB에서 소유·휴지통 여부(author_id = 나, deleted_at IS NULL)를 확인한다 — 휴지통 글은 404(006 FR-023).
        판정 순서: 401 → 403 → 429(요청 제한) → 404 → 400 → 409.
        Redis 장애 시 DB에 바로 저장하고 버전 확인도 DB 기준(FR-018).
        사용자당 5초에 1번, 요청 본문 1MB(설정값).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '200':
          description: 저장됨 → 클라이언트는 baseVersion = version, dirty = false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: 서버 쪽 임시 보관소 쓰기 실패(메모리 부족 등). 내용은 기기에 남고 브라우저가 재시도한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: AUTOSAVE_UNAVAILABLE
                message: 잠시 후 다시 저장할게요.
                errors: []
                details: null

  /api/posts/{postId}/publish:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [publish]
      operationId: publishPost
      summary: 발행·다시 발행 (05 §5~§7)
      description: |
        최초 발행과 다시 발행이 같은 API다. [발행]을 누를 때마다 브라우저가 새 UUID Idempotency-Key를 만든다.
        같은 키: 처리 중이면 409 IN_PROGRESS(1초 뒤 같은 키로 재시도), 끝났으면 저장된 응답(10분 보관), 다른 내용이면 422.
        실패하면 키를 풀어 같은 키로 다시 시도할 수 있다. 성공 응답은 첫 처리와 재생 모두 200이다.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID. 없으면 400 IDEMPOTENCY_KEY_REQUIRED, 형식 오류는 400 INVALID_IDEMPOTENCY_KEY (제안)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: 발행됨 → 화면은 url로 이동
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400':
          description: |
            검증 실패(실패 항목 전부, 글 상태는 그대로). code = VALIDATION_FAILED,
            errors[].code ∈ TITLE_REQUIRED, TITLE_TOO_LONG, CONTENT_REQUIRED, CONTENT_TOO_LONG, CONTENT_TOO_COMPLEX,
            PENDING_IMAGES, TOO_MANY_TAGS, INVALID_TAG, TAG_TOO_LONG, TAG_BANNED_WORD, INVALID_VISIBILITY.
            또는 Idempotency-Key 문제(code = IDEMPOTENCY_KEY_REQUIRED / INVALID_IDEMPOTENCY_KEY, 제안).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    errors:
                      - { field: title, code: TITLE_REQUIRED, message: 제목을 입력해 주세요. }
                      - { field: contentMd, code: PENDING_IMAGES, message: 업로드가 끝나지 않은 사진이 있어요. }
                      - { field: 'tags[2]', code: INVALID_TAG, message: 쓸 수 없는 글자가 있어요., value: '🔥hot' }
                    details: null
                tooComplex:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    errors:
                      - { field: contentMd, code: CONTENT_TOO_COMPLEX, message: '글 구조가 너무 복잡해요 (목록·인용은 20단계까지)' }
                    details: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: VERSION_CONFLICT(다른 탭·기기에서 먼저 저장, details.server) 또는 IN_PROGRESS(같은 키 처리 중)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                versionConflict:
                  value:
                    code: VERSION_CONFLICT
                    message: 다른 탭이나 기기에서 이 글이 수정되었어요.
                    errors: []
                    details:
                      server: { title: JPA N+1 정리, contentMd: "## 원인\n…", version: 14, savedAt: '2026-10-02T14:03:12+09:00' }
                inProgress:
                  value:
                    code: IN_PROGRESS
                    message: 발행 중이에요.
                    errors: []
                    details: null
        '422':
          description: 같은 Idempotency-Key로 다른 내용을 보냄(클라이언트 버그)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: IDEMPOTENCY_KEY_REUSED
                message: 같은 요청 키로 다른 내용을 보낼 수 없어요.
                errors: []
                details: null

  /api/markdown/preview:
    post:
      tags: [markdown]
      operationId: previewMarkdown
      summary: 서버 렌더러 미리보기 (12 §7-6)
      description: |
        발행과 같은 ContentRenderer 결과(정화된 HTML). 로그인 필요(이메일 인증 여부 무관, spec 가정).
        입력이 0.5초 멈추면 호출, 사용자당 1분에 60번. 사진 판별 기준은 로그인한 본인.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentMd]
              properties:
                contentMd: { type: string, maxLength: 100000 }
      responses:
        '200':
          description: 정화된 HTML
          content:
            application/json:
              schema:
                type: object
                required: [html]
                properties:
                  html: { type: string }
        '400':
          description: CONTENT_TOO_COMPLEX(중첩 20단계·1초 초과) 또는 CONTENT_TOO_LONG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: CONTENT_TOO_COMPLEX
                message: 글 구조가 너무 복잡해요 (목록·인용은 20단계까지)
                errors: []
                details: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session 세션 쿠키(HttpOnly, Secure, SameSite=Lax)

  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: CSRF 토큰(저장 방식은 M17 확정 전 가정). 없거나 틀리면 403(Spring Security).
      schema: { type: string }

  schemas:
    ErrorResponse:
      type: object
      description: 공통 오류 본문 (02 §5-1, O8)
      required: [code, message]
      properties:
        code: { type: string, description: 대문자 이유 코드 }
        message: { type: string }
        errors:
          type: array
          description: 입력 검증 오류일 때만 항목이 있다
          items: { $ref: '#/components/schemas/FieldError' }
        details:
          description: 추가 정보(선택). VERSION_CONFLICT는 {server}
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConflictDetails'
            - type: object

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [title, contentMd, 'tags[2]', visibility] }
        code: { type: string }
        message: { type: string }
        value: { type: string, description: 문제가 된 입력값(태그 오류에서 사용, 22 §2-2) }

    ConflictDetails:
      type: object
      required: [server]
      properties:
        server: { $ref: '#/components/schemas/ServerCopy' }

    ServerCopy:
      type: object
      required: [title, contentMd, version, savedAt]
      properties:
        title: { type: string }
        contentMd: { type: string }
        version: { type: integer, format: int64 }
        savedAt: { type: string, format: date-time }

    CreatePostRequest:
      type: object
      properties:
        title: { type: string, maxLength: 100, default: '' }
        contentMd: { type: string, maxLength: 100000, default: '' }

    SaveRequest:
      type: object
      required: [title, contentMd, baseVersion]
      properties:
        title: { type: string, maxLength: 100, description: 입력 그대로 저장(정리는 발행 때) }
        contentMd: { type: string, maxLength: 100000, description: '`local:` 임시 사진 주소 허용' }
        baseVersion: { type: integer, format: int64, minimum: 0, description: 이 내용이 출발한 서버 편집 버전 }

    SaveResponse:
      type: object
      required: [version, savedAt]
      properties:
        version: { type: integer, format: int64 }
        savedAt: { type: string, format: date-time, description: '"✓ 저장됨 14:03" 표시용' }

    WorkingCopy:
      type: object
      required: [postId, status, editing, title, contentMd, version, savedAt, visibility, tags]
      properties:
        postId: { type: integer, format: int64 }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        editing: { type: boolean, description: 발행 글에 작업본(또는 서버 임시 보관분)이 있어 "수정 중"인지 }
        title: { type: string }
        contentMd: { type: string }
        version: { type: integer, format: int64, description: 현재 버전 = max(Redis, post_draft, post) }
        savedAt: { type: string, format: date-time }
        visibility: { $ref: '#/components/schemas/Visibility' }
        tags: { type: array, items: { type: string }, description: 현재 발행본의 태그(발행 설정 초기값) }
        url: { type: [string, 'null'], description: '발행 글이면 /@{handle}/posts/{postId}' }

    PublishRequest:
      type: object
      required: [title, contentMd, tags, visibility, baseVersion]
      properties:
        title: { type: string }
        contentMd: { type: string }
        tags: { type: array, items: { type: string }, description: '정규화·개수 제한은 008 (기본 최대 10, blog.post.max-tags)' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        baseVersion: { type: integer, format: int64, minimum: 0 }
      example:
        title: JPA N+1 정리
        contentMd: "## 문제\n…"
        tags: [spring, jpa]
        visibility: PUBLIC
        baseVersion: 13

    PublishResponse:
      type: object
      required: [url, publishedAt, firstPublicAt, editedAt, version]
      properties:
        url: { type: string, examples: ['/@alice/posts/42'] }
        publishedAt: { type: string, format: date-time }
        firstPublicAt: { type: [string, 'null'], format: date-time, description: 아직 한 번도 전체 공개가 아니면 null }
        editedAt: { type: [string, 'null'], format: date-time, description: 최초 발행이면 null }
        version: { type: integer, format: int64 }

    Visibility:
      type: string
      enum: [PUBLIC, PRIVATE]
      description: 값 추가(FRIENDS 등)는 004·개인 확장

  responses:
    ValidationFailed:
      description: 입력 검증 실패 (TITLE_TOO_LONG, CONTENT_TOO_LONG 등)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: VALIDATION_FAILED
            message: 입력값을 확인해 주세요.
            errors:
              - { field: title, code: TITLE_TOO_LONG, message: 제목은 100자까지예요. }
            details: null
    Unauthorized:
      description: 비회원
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: LOGIN_REQUIRED, message: 로그인이 필요해요., errors: [], details: null }
    Forbidden:
      description: 계정 상태(인증 전·탈퇴 유예). 403은 계정 상태에만 쓴다(42 §4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            notVerified:
              value: { code: EMAIL_NOT_VERIFIED, message: 이메일 인증 후 글을 쓸 수 있어요., errors: [], details: null }
            withdrawn:
              value: { code: ACCOUNT_WITHDRAWN, message: 탈퇴 신청한 계정이에요., errors: [], details: null }
    NotFound:
      description: 없는 글·남의 글·휴지통 글 (구분하지 않음)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 볼 수 없는 페이지예요., errors: [], details: null }
    VersionConflict:
      description: 다른 탭·기기에서 먼저 저장함. 저장하지 않았다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: VERSION_CONFLICT
            message: 다른 탭이나 기기에서 이 글이 수정되었어요.
            errors: []
            details:
